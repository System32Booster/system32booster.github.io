<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TETRIS // ARCADE</title>
<style>
  :root{
    --bg-deep: #14152b;
    --bg-panel: #1d1f3d;
    --grid-line: #2c2e57;
    --neon-cyan: #4dfff2;
    --neon-pink: #ff4de0;
    --neon-amber: #ffcf4d;
    --text-dim: #8a8dc7;
    --text-bright: #eef0ff;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, #22244a 0%, var(--bg-deep) 55%, #0c0d1c 100%);
    color: var(--text-bright);
    font-family: 'Courier New', monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  .stage{
    display:flex;
    gap: 28px;
    align-items:flex-start;
    padding: 24px;
  }

  /* ---- Title strip ---- */
  .title-block{
    grid-column: 1 / -1;
  }

  h1{
    font-size: 28px;
    letter-spacing: 6px;
    margin: 0 0 4px 0;
    color: var(--neon-cyan);
    text-shadow: 0 0 8px rgba(77,255,242,0.6), 0 0 22px rgba(77,255,242,0.25);
  }
  h1 span{ color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,77,224,0.6), 0 0 22px rgba(255,77,224,0.25); }

  .subtitle{
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  /* ---- Board ---- */
  .board-wrap{
    position:relative;
    padding: 10px;
    background: linear-gradient(180deg, #23254a, #1a1c38);
    border-radius: 10px;
    box-shadow:
      0 0 0 2px #33356a,
      0 0 0 6px #0c0d1c,
      0 18px 40px rgba(0,0,0,0.55),
      inset 0 0 30px rgba(0,0,0,0.4);
  }

  canvas#board{
    display:block;
    background: #0d0e20;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px var(--grid-line);
  }

  .overlay{
    position:absolute; inset:10px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    background: rgba(10,10,24,0.86);
    border-radius: 3px;
    text-align:center;
    gap: 10px;
    animation: fadeIn 0.25s ease-out;
  }
  .overlay.hidden{ display:none; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .overlay .big{
    font-size: 20px;
    letter-spacing: 4px;
    color: var(--neon-amber);
    text-shadow: 0 0 10px rgba(255,207,77,0.6);
  }
  .overlay .small{
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    line-height: 1.8;
  }
  .overlay button{
    margin-top: 6px;
    background: var(--neon-cyan);
    color: #06131f;
    border: none;
    padding: 10px 22px;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(77,255,242,0.5);
  }
  .overlay button:hover{ filter: brightness(1.1); }

  /* ---- Side panel ---- */
  .side{
    display:flex;
    flex-direction:column;
    gap: 16px;
    width: 170px;
  }

  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--grid-line);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .panel .label{
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .panel .value{
    font-size: 22px;
    color: var(--neon-cyan);
    text-shadow: 0 0 8px rgba(77,255,242,0.4);
    font-weight: bold;
  }

  #next-canvas{
    display:block;
    margin: 4px auto 0;
    background:#0d0e20;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px var(--grid-line);
  }

  .keys{
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.9;
    letter-spacing: 0.5px;
  }
  .keys b{ color: var(--text-bright); }

  .lvl-bar{
    height: 6px;
    background: #0d0e20;
    border-radius: 3px;
    overflow:hidden;
    margin-top: 6px;
  }
  .lvl-bar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-amber));
    width: 0%;
    transition: width 0.3s;
  }

  .footer-hint{
    font-size: 9px;
    color: #565a91;
    letter-spacing: 1px;
    text-align:center;
  }

  @media (max-width: 640px){
    .stage{ flex-direction:column; align-items:center; }
    .side{ flex-direction:row; flex-wrap:wrap; width: 320px; }
    .panel{ flex:1; min-width: 90px; }
  }
</style>
</head>
<body>

<div>
  <div class="title-block">
    <h1>TETRIS<span>_</span></h1>
    <div class="subtitle">ARCADE EDITION // KEYBOARD REQUIRED</div>
  </div>

  <div class="stage" style="padding-top:0;">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <div class="big" id="overlay-title">TETRIS</div>
        <div class="small" id="overlay-text">← → で移動 / ↑ で回転<br>↓ でソフトドロップ / SPACE でハードドロップ<br>P でポーズ</div>
        <button id="overlay-btn">START</button>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="panel">
        <div class="label">LEVEL</div>
        <div class="value" id="level">1</div>
        <div class="lvl-bar"><div class="lvl-bar-fill" id="lvl-fill"></div></div>
      </div>
      <div class="panel">
        <div class="label">LINES</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="panel">
        <div class="label">NEXT</div>
        <canvas id="next-canvas" width="100" height="100"></canvas>
      </div>
      <div class="panel keys">
        <b>←→</b> 移動<br>
        <b>↑</b> 回転<br>
        <b>↓</b> ソフトドロップ<br>
        <b>SPACE</b> ハードドロップ<br>
        <b>P</b> ポーズ / 再開
      </div>
      <div class="footer-hint">HIGH SCORE: <span id="highscore">0</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 10, ROWS = 20;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next-canvas');
  const nctx = nextCanvas.getContext('2d');

  // Responsive-ish fixed cell size
  const CELL = 28;
  boardCanvas.width = COLS * CELL;
  boardCanvas.height = ROWS * CELL;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const lvlFill = document.getElementById('lvl-fill');
  const highscoreEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const overlayBtn = document.getElementById('overlay-btn');

  const COLORS = {
    I: '#4dfff2',
    O: '#ffcf4d',
    T: '#c98bff',
    S: '#66ff8c',
    Z: '#ff5d6c',
    J: '#5d8bff',
    L: '#ff9f4d'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const TYPES = Object.keys(SHAPES);

  let grid, current, next, score, level, lines, dropInterval, dropTimer;
  let gameOver, paused, running;
  let highscore = Number(localStorage.getItem('tetris_hs') || 0);
  highscoreEl.textContent = highscore;

  function emptyGrid(){
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function rotateCells(cells){
    // rotate around approximate center (1.5,1.5) then round; works fine for classic feel
    const cx = 1.5, cy = 1.5;
    return cells.map(([x,y]) => {
      const nx = Math.round(cx - (y - cy));
      const ny = Math.round(cy + (x - cx));
      return [nx, ny];
    });
  }

  function newPiece(){
    const type = TYPES[Math.floor(Math.random()*TYPES.length)];
    return {
      type,
      cells: SHAPES[type].map(c => c.slice()),
      x: 3,
      y: -1,
      color: COLORS[type]
    };
  }

  function absCells(piece){
    return piece.cells.map(([x,y]) => [x + piece.x, y + piece.y]);
  }

  function collides(piece, offX=0, offY=0, cells=null){
    const c = cells || piece.cells;
    for (const [x,y] of c){
      const nx = x + piece.x + offX;
      const ny = y + piece.y + offY;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && grid[ny][nx]) return true;
    }
    return false;
  }

  function lockPiece(){
    for (const [x,y] of absCells(current)){
      if (y < 0){ triggerGameOver(); return; }
      grid[y][x] = current.color;
    }
    clearLines();
    current = next;
    next = newPiece();
    drawNext();
    if (collides(current)) triggerGameOver();
  }

  function clearLines(){
    let cleared = 0;
    for (let y = ROWS-1; y >= 0; y--){
      if (grid[y].every(cell => cell)){
        grid.splice(y,1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++; // re-check same index after shift
      }
    }
    if (cleared > 0){
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel !== level){
        level = newLevel;
        dropInterval = Math.max(100, 1000 - (level-1)*80);
      }
      updateHUD();
    }
  }

  function updateHUD(){
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
    lvlFill.style.width = Math.min(100, ((lines % 10)/10)*100) + '%';
    if (score > highscore){
      highscore = score;
      highscoreEl.textContent = highscore;
      localStorage.setItem('tetris_hs', highscore);
    }
  }

  function hardDrop(){
    let dist = 0;
    while (!collides(current, 0, dist+1)) dist++;
    current.y += dist;
    score += dist * 2;
    lockPiece();
    updateHUD();
    draw();
  }

  function tryRotate(){
    if (current.type === 'O') return;
    const rotated = rotateCells(current.cells);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks){
      if (!collides(current, k, 0, rotated)){
        current.cells = rotated;
        current.x += k;
        return;
      }
    }
  }

  function ghostY(){
    let dist = 0;
    while (!collides(current, 0, dist+1)) dist++;
    return current.y + dist;
  }

  function draw(){
    ctx.clearRect(0,0,boardCanvas.width, boardCanvas.height);

    // grid lines
    ctx.strokeStyle = 'rgba(80,84,150,0.18)';
    ctx.lineWidth = 1;
    for (let x=0; x<=COLS; x++){
      ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke();
    }
    for (let y=0; y<=ROWS; y++){
      ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke();
    }

    // locked cells
    for (let y=0; y<ROWS; y++){
      for (let x=0; x<COLS; x++){
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);
      }
    }

    // ghost
    const gy = ghostY();
    ctx.save();
    ctx.globalAlpha = 0.18;
    for (const [x,y] of current.cells){
      drawCell(ctx, x+current.x, y+gy, current.color, true);
    }
    ctx.restore();

    // current piece
    for (const [x,y] of absCells(current)){
      if (y >= 0) drawCell(ctx, x, y, current.color);
    }
  }

  function drawCell(context, x, y, color, outlineOnly=false){
    const px = x*CELL, py = y*CELL;
    if (outlineOnly){
      context.fillStyle = color;
      context.fillRect(px+2, py+2, CELL-4, CELL-4);
      return;
    }
    context.fillStyle = color;
    context.fillRect(px+1, py+1, CELL-2, CELL-2);
    context.fillStyle = 'rgba(255,255,255,0.25)';
    context.fillRect(px+1, py+1, CELL-2, 4);
    context.fillStyle = 'rgba(0,0,0,0.25)';
    context.fillRect(px+1, py+CELL-5, CELL-2, 4);
  }

  function drawNext(){
    nctx.clearRect(0,0,nextCanvas.width, nextCanvas.height);
    const cell = 20;
    const offX = (nextCanvas.width - 4*cell)/2;
    const offY = (nextCanvas.height - 4*cell)/2;
    for (const [x,y] of next.cells){
      nctx.fillStyle = next.color;
      nctx.fillRect(offX + x*cell + 1, offY + y*cell + 1, cell-2, cell-2);
    }
  }

  function loop(timestamp){
    if (!running) return;
    if (!paused){
      if (!loop.last) loop.last = timestamp;
      const delta = timestamp - loop.last;
      if (delta > dropInterval){
        loop.last = timestamp;
        softDropStep();
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function softDropStep(){
    if (!collides(current, 0, 1)){
      current.y += 1;
    } else {
      lockPiece();
      updateHUD();
    }
  }

  function triggerGameOver(){
    gameOver = true;
    running = false;
    overlayTitle.textContent = 'GAME OVER';
    overlayTitle.style.color = 'var(--neon-pink)';
    overlayText.innerHTML = `SCORE: ${score}<br>LINES: ${lines}<br>もう一度挑戦しよう`;
    overlayBtn.textContent = 'RETRY';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    grid = emptyGrid();
    current = newPiece();
    next = newPiece();
    score = 0; level = 1; lines = 0;
    dropInterval = 1000;
    gameOver = false; paused = false; running = true;
    loop.last = null;
    overlay.classList.add('hidden');
    overlayTitle.style.color = 'var(--neon-amber)';
    updateHUD();
    drawNext();
    draw();
    requestAnimationFrame(loop);
  }

  function togglePause(){
    if (gameOver || !running) return;
    paused = !paused;
    if (paused){
      overlayTitle.textContent = 'PAUSED';
      overlayText.innerHTML = 'P キーで再開';
      overlayBtn.textContent = 'RESUME';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      loop.last = null;
      requestAnimationFrame(loop);
    }
  }

  overlayBtn.addEventListener('click', () => {
    if (paused){ togglePause(); return; }
    startGame();
  });

  document.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)){
      e.preventDefault();
    }
    if (e.code === 'KeyP'){ togglePause(); return; }
    if (!running || paused || gameOver) return;

    switch(e.code){
      case 'ArrowLeft':
        if (!collides(current, -1, 0)) current.x -= 1;
        break;
      case 'ArrowRight':
        if (!collides(current, 1, 0)) current.x += 1;
        break;
      case 'ArrowDown':
        softDropStep();
        score += 1;
        updateHUD();
        break;
      case 'ArrowUp':
        tryRotate();
        break;
      case 'Space':
        hardDrop();
        break;
    }
    draw();
  });

  // initial static render before start
  grid = emptyGrid();
  current = newPiece();
  next = newPiece();
  drawNext();
  draw();
})();
</script>
</body>
</html>
