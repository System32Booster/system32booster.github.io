<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロフィールカード</title>
<style>
  :root {
    --navy: #0b2a5b;
    --blue: #2563eb;
    --sky: #60a5fa;
    --pale: #e8f1ff;
    --bg: #dbeafe;
    --text: #1e3a5f;
    --sub: #5b7397;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #eaf3ff 0%, var(--bg) 100%);
  }

  /* ---------- カード ---------- */
  .card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.18);
    animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- ヘッダー ---------- */
  .cover {
    position: relative;
    height: 120px;
    background: linear-gradient(120deg, var(--navy), var(--blue) 60%, var(--sky));
    overflow: hidden;
  }

  .cover::before,
  .cover::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    animation: float 7s ease-in-out infinite;
  }
  .cover::before { width: 140px; height: 140px; top: -50px; right: -30px; }
  .cover::after  { width: 80px; height: 80px; bottom: -30px; left: 30px; animation-delay: -3s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(12px); }
  }

  /* ---------- アバター ---------- */
  .avatar-wrap {
    position: relative;
    width: 104px;
    height: 104px;
    margin: -52px auto 0;
  }

  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(var(--blue), var(--sky), var(--pale), var(--blue));
    animation: spin 6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid #fff;
    display: grid;
    place-items: center;
    font-size: 40px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--blue), var(--navy));
  }

  /* ---------- 本文 ---------- */
  .body { padding: 16px 28px 28px; text-align: center; }

  .name { font-size: 22px; font-weight: 700; color: var(--navy); }
  .role { margin-top: 4px; font-size: 14px; color: var(--blue); font-weight: 600; }
  .bio  { margin-top: 14px; font-size: 14px; line-height: 1.8; color: var(--sub); }

  /* ---------- 数字 ---------- */
  .stats {
    display: flex;
    margin-top: 20px;
    padding: 14px 0;
    background: var(--pale);
    border-radius: 16px;
  }
  .stat { flex: 1; }
  .stat + .stat { border-left: 1px solid #c7dbfb; }
  .stat b { display: block; font-size: 18px; color: var(--navy); }
  .stat span { font-size: 12px; color: var(--sub); }

  /* ---------- スキル ---------- */
  .skills { margin-top: 20px; text-align: left; }
  .skill + .skill { margin-top: 12px; }
  .skill-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .bar { height: 8px; background: var(--pale); border-radius: 99px; overflow: hidden; }
  .fill {
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--blue), var(--sky));
    transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ---------- ボタン ---------- */
  .actions { display: flex; gap: 10px; margin-top: 24px; }

  .btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 14px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s, color 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .btn-primary {
    border: 2px solid var(--blue);
    background: var(--blue);
    color: #fff;
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
  }
  .btn-primary.following {
    background: #fff;
    color: var(--blue);
    box-shadow: none;
  }

  .btn-sub {
    border: 2px solid var(--pale);
    background: var(--pale);
    color: var(--blue);
  }
  .btn-sub:hover { background: #d3e5ff; }

  /* ---------- 動きを減らす設定 ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<article class="card">
  <div class="cover"></div>

  <div class="avatar-wrap">
    <div class="avatar" aria-hidden="true">葵</div>
  </div>

  <div class="body">
    <h1 class="name">青井 葵</h1>
    <p class="role">Webデザイナー</p>
    <p class="bio">
      見やすくてわかりやすいデザインが好きです。<br>
      ブルーの配色とシンプルな UI をよく作っています。
    </p>

    <div class="stats">
      <div class="stat"><b data-count="128">0</b><span>作品</span></div>
      <div class="stat"><b id="followers" data-count="2400">0</b><span>フォロワー</span></div>
      <div class="stat"><b data-count="86">0</b><span>フォロー中</span></div>
    </div>

    <div class="skills">
      <div class="skill">
        <div class="skill-head"><span>デザイン</span><span>90%</span></div>
        <div class="bar"><div class="fill" data-level="90"></div></div>
      </div>
      <div class="skill">
        <div class="skill-head"><span>HTML / CSS</span><span>80%</span></div>
        <div class="bar"><div class="fill" data-level="80"></div></div>
      </div>
      <div class="skill">
        <div class="skill-head"><span>JavaScript</span><span>65%</span></div>
        <div class="bar"><div class="fill" data-level="65"></div></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="followBtn" type="button">フォローする</button>
      <a class="btn btn-sub" href="mailto:hello@example.com">連絡する</a>
    </div>
  </div>
</article>

<script>
  // 数字をカウントアップ
  const counters = document.querySelectorAll("[data-count]");
  const followersEl = document.getElementById("followers");
  let followers = Number(followersEl.dataset.count);

  function countUp(el, target, duration = 1200) {
    const start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // スキルバーを伸ばす
  window.addEventListener("load", () => {
    setTimeout(() => {
      counters.forEach(el => countUp(el, Number(el.dataset.count)));
      document.querySelectorAll(".fill").forEach(el => {
        el.style.width = el.dataset.level + "%";
      });
    }, 500);
  });

  // フォローボタン
  const followBtn = document.getElementById("followBtn");
  let isFollowing = false;

  followBtn.addEventListener("click", () => {
    isFollowing = !isFollowing;
    followers += isFollowing ? 1 : -1;
    followersEl.textContent = followers.toLocaleString();
    followBtn.textContent = isFollowing ? "フォロー中" : "フォローする";
    followBtn.classList.toggle("following", isFollowing);
  });
</script>

</body>
</html>
