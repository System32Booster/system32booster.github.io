<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィールカード</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Noto+Sans+JP:wght@300;400;500;600&amp;display=swap');
        
        :root {
            --primary-blue: #2563eb;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
        }

        .profile-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                       box-shadow 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            animation: cardEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .profile-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25), 
                       0 10px 10px -6px rgb(0 0 0 / 0.1);
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .stat-number {
            transition: all 0.3s ease;
        }

        .skill-tag {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .skill-tag:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 6px -1px rgb(37 99 235 / 0.1), 
                       0 2px 4px -2px rgb(37 99 235 / 0.1);
        }

        .blue-gradient {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
        }

        .section-header {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .avatar-container {
            position: relative;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .avatar-container:hover {
            transform: scale(1.06);
        }

        .avatar-container::after {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            border-radius: 9999px;
            z-index: -1;
            opacity: 0.15;
            transition: all 0.3s ease;
        }
        
        .avatar-container:hover::after {
            opacity: 0.3;
            transform: scale(1.1);
        }

        .stat-item {
            transition: all 0.2s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-2px);
        }

        .action-btn {
            transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        
        .action-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .social-icon {
            transition: all 0.2s ease;
        }
        
        .social-icon:hover {
            transform: translateY(-3px) scale(1.1);
            color: #2563eb;
        }

        .modal {
            animation: modalEnter 0.2s ease forwards;
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .profile-header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
        }

        .subtle-shadow {
            box-shadow: 0 10px 15px -3px rgb(30 64 175 / 0.1), 
                       0 4px 6px -4px rgb(30 64 175 / 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-[380px] w-full">
        <!-- ヘッダー -->
        <div class="flex items-center justify-between mb-4 px-1">
            <div>
                <h1 class="text-white text-2xl font-semibold tracking-tight">プロフィール</h1>
                <p class="text-blue-200 text-sm">シンプルで直感的なデザイン</p>
            </div>
            <div class="flex items-center gap-x-2 bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-3xl border border-white/20">
                <div class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></div>
                <span class="text-emerald-300 text-xs font-medium">オンライン</span>
            </div>
        </div>

        <!-- プロフィールカード -->
        <div class="profile-card bg-white rounded-3xl subtle-shadow overflow-hidden border border-blue-100">
            
            <!-- 上部グラデーションエリア -->
            <div class="profile-header h-20 relative">
                <div class="absolute inset-0 bg-[radial-gradient(at_center,#ffffff15_0%,transparent_70%)]"></div>
                
                <!-- アバター -->
                <div class="absolute left-1/2 top-10 -translate-x-1/2">
                    <div class="avatar-container">
                        <div onclick="animateAvatar(this)" 
                             class="w-24 h-24 rounded-full overflow-hidden ring-4 ring-white shadow-xl cursor-pointer border-[5px] border-blue-100">
                            <img src="https://i.pravatar.cc/150?img=47" 
                                 alt="佐藤 あかりのプロフィール写真" 
                                 class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>

            <!-- メインコンテンツ -->
            <div class="pt-14 px-6 pb-6">
                
                <!-- 名前と肩書き -->
                <div class="text-center mb-5">
                    <h2 class="text-2xl font-semibold text-slate-800 tracking-tight">佐藤 あかり</h2>
                    <p class="text-blue-600 font-medium text-[15px]">プロダクトデザイナー</p>
                    <div class="flex items-center justify-center gap-x-1.5 mt-1">
                        <div class="flex items-center text-xs text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314-11.314z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span>東京, 日本</span>
                        </div>
                    </div>
                </div>

                <!-- 自己紹介 -->
                <div class="mb-6">
                    <p class="text-slate-600 text-[14.2px] leading-relaxed text-center">
                        ユーザーが自然に心地よく使える<br>
                        直感的で美しいプロダクトを<br>
                        デザインしています。
                    </p>
                </div>

                <!-- 統計情報 -->
                <div class="mb-6">
                    <div class="grid grid-cols-3 gap-3">
                        <!-- プロジェクト -->
                        <div onclick="highlightStat(this)" class="stat-item bg-blue-50 hover:bg-blue-100 cursor-pointer rounded-2xl p-3 text-center transition-colors">
                            <div class="text-xs font-medium text-blue-500 tracking-wider section-header mb-1">PROJECTS</div>
                            <div id="projects" class="stat-number text-2xl font-semibold text-slate-800">124</div>
                            <div class="text-[10px] text-blue-400 font-medium">プロジェクト</div>
                        </div>
                        
                        <!-- フォロワー -->
                        <div onclick="highlightStat(this)" class="stat-item bg-blue-50 hover:bg-blue-100 cursor-pointer rounded-2xl p-3 text-center transition-colors">
                            <div class="text-xs font-medium text-blue-500 tracking-wider section-header mb-1">FOLLOWERS</div>
                            <div id="followers" class="stat-number text-2xl font-semibold text-slate-800">8.4k</div>
                            <div class="text-[10px] text-blue-400 font-medium">フォロワー</div>
                        </div>
                        
                        <!-- 評価 -->
                        <div onclick="highlightStat(this)" class="stat-item bg-blue-50 hover:bg-blue-100 cursor-pointer rounded-2xl p-3 text-center transition-colors">
                            <div class="text-xs font-medium text-blue-500 tracking-wider section-header mb-1">RATING</div>
                            <div id="rating" class="stat-number text-2xl font-semibold text-slate-800">4.9</div>
                            <div class="text-[10px] text-blue-400 font-medium">評価</div>
                        </div>
                    </div>
                </div>

                <!-- スキル -->
                <div class="mb-6">
                    <div class="text-xs font-semibold text-blue-600 mb-2 px-1 tracking-wider section-header">SKILLS</div>
                    <div class="flex flex-wrap gap-2">
                        <div class="skill-tag px-3 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded-2xl">Figma</div>
                        <div class="skill-tag px-3 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded-2xl">UI/UX</div>
                        <div class="skill-tag px-3 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded-2xl">Tailwind</div>
                        <div class="skill-tag px-3 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded-2xl">React</div>
                        <div class="skill-tag px-3 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded-2xl">Prototyping</div>
                    </div>
                </div>

                <!-- アクションボタン -->
                <div class="flex gap-3">
                    <button onclick="followUser(this)" 
                            class="action-btn flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-5 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-sm active:scale-[0.985]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                        </svg>
                        <span id="follow-text">フォローする</span>
                    </button>
                    
                    <button onclick="openMessageModal()" 
                            class="action-btn flex-1 bg-white border border-blue-200 hover:bg-blue-50 text-blue-700 font-semibold py-3 px-5 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-sm active:scale-[0.985]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <span>メッセージ</span>
                    </button>
                </div>

                <!-- ソーシャルリンク -->
                <div class="mt-6 flex justify-center items-center gap-x-5">
                    <a href="#" class="social-icon text-blue-400 hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M18.244 2.25l-7.451 7.452-7.45-7.452L.75 3.75l7.452 7.451L.75 18.75l2.599 1.5 7.45-7.451 7.452 7.451 1.5-1.5-7.452-7.451L21.75 3.75z"/>
                        </svg>
                    </a>
                    <a href="#" class="social-icon text-blue-400 hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.064 0-1.14.92-2.064 2.063-2.064 1.14 0 2.064.925 2.064 2.064 0 1.139-.925 2.064-2.064 2.064zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                    </a>
                    <a href="#" class="social-icon text-blue-400 hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- フッター情報 -->
        <div class="text-center mt-4">
            <p class="text-blue-300 text-xs">最終更新: 2026年1月</p>
        </div>
    </div>

    <!-- メッセージモーダル -->
    <div id="message-modal" onclick="closeMessageModal(event)" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end md:items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" 
             class="modal bg-white w-full md:w-[380px] md:rounded-3xl md:m-4 rounded-t-3xl p-6 shadow-2xl">
            
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h3 class="font-semibold text-lg text-slate-800">メッセージを送る</h3>
                    <p class="text-blue-500 text-xs">佐藤 あかり さんへ</p>
                </div>
                <button onclick="closeMessageModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6h12v12" />
                    </svg>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">件名</label>
                    <input id="message-subject" type="text" value="Webデザインについて相談したいです" 
                           class="w-full px-4 py-2.5 text-sm border border-blue-200 focus:border-blue-400 focus:outline-none rounded-2xl">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">メッセージ</label>
                    <textarea id="message-body" rows="4" placeholder="ご用件をお書きください..." 
                              class="w-full px-4 py-3 text-sm border border-blue-200 focus:border-blue-400 focus:outline-none rounded-3xl resize-none">こんにちは。あなたのデザインに興味があり、プロジェクトについて少しお話できればと思います。</textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeMessageModal()" 
                        class="flex-1 py-[13px] px-5 border border-blue-100 hover:bg-blue-50 text-blue-600 font-medium rounded-2xl text-sm transition-colors">
                    キャンセル
                </button>
                <button onclick="sendMessage()" 
                        class="flex-1 py-[13px] px-5 bg-blue-600 hover:bg-blue-700 transition-all text-white font-medium rounded-2xl text-sm flex items-center justify-center gap-2">
                    <span id="send-btn-text">送信する</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 成功トースト -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-3xl shadow-2xl flex items-center gap-3 text-sm">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
            <span id="toast-text"></span>
        </div>
    </div>

    <script>
        // 統計値アニメーション
        function animateValue(id, start, end, duration, isDecimal = false) {
            const element = document.getElementById(id);
            if (!element) return;
            
            const startTime = performance.now();
            const range = end - start;
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // イージング関数
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                let currentValue = start + range * easeProgress;
                
                if (isDecimal) {
                    element.textContent = currentValue.toFixed(1);
                } else if (id === 'followers') {
                    element.textContent = currentValue.toFixed(1) + 'k';
                } else {
                    element.textContent = Math.floor(currentValue);
                }
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    // 最終値
                    if (id === 'followers') {
                        element.textContent = end + 'k';
                    } else if (isDecimal) {
                        element.textContent = end.toFixed(1);
                    } else {
                        element.textContent = end;
                    }
                }
            }
            
            requestAnimationFrame(update);
        }

        // ページ読み込み時に統計アニメーション開始
        function initStats() {
            // 少し遅延させて自然なアニメーションに
            setTimeout(() => {
                animateValue('projects', 0, 124, 1200);
            }, 350);
            
            setTimeout(() => {
                animateValue('followers', 0, 8.4, 1400);
            }, 550);
            
            setTimeout(() => {
                animateValue('rating', 0, 4.9, 1100, true);
            }, 750);
        }

        // アバタークリック時のアニメーション
        function animateAvatar(element) {
            element.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            element.style.transform = 'scale(0.85)';
            
            setTimeout(() => {
                element.style.transform = 'scale(1.15)';
            }, 120);
            
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 450);
            
            // ちょっとしたエフェクト
            const ring = element.parentElement;
            if (ring) {
                ring.style.transition = 'box-shadow 0.3s ease';
                ring.style.boxShadow = '0 0 0 8px rgba(59, 130, 246, 0.15)';
                
                setTimeout(() => {
                    ring.style.boxShadow = '';
                }, 700);
            }
        }

        // 統計ハイライト
        function highlightStat(element) {
            element.style.transition = 'all 0.15s ease';
            element.style.transform = 'scale(0.95)';
            element.style.backgroundColor = '#dbeafe';
            
            setTimeout(() => {
                element.style.transform = 'scale(1)';
                element.style.backgroundColor = '';
            }, 180);
            
            // 少し数値を点滅させる
            const number = element.querySelector('.stat-number');
            if (number) {
                number.style.transition = 'color 0.2s ease';
                number.style.color = '#1e40af';
                
                setTimeout(() => {
                    number.style.color = '';
                }, 550);
            }
        }

        // フォローボタン
        let isFollowing = false;
        
        function followUser(button) {
            const text = document.getElementById('follow-text');
            
            if (!isFollowing) {
                // フォローする
                button.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                button.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                
                text.textContent = 'フォロー中';
                
                // チェックマークに変更
                button.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7" />
                    </svg>
                    <span>フォロー中</span>
                `;
                
                isFollowing = true;
                
                // フォロワー数をアニメーションで増やす
                const followersEl = document.getElementById('followers');
                const currentVal = parseFloat(followersEl.textContent);
                const newVal = currentVal + 0.1;
                
                followersEl.style.transition = 'all .2s ease';
                followersEl.style.color = '#166534';
                
                setTimeout(() => {
                    followersEl.textContent = newVal.toFixed(1) + 'k';
                    
                    setTimeout(() => {
                        followersEl.style.color = '';
                    }, 600);
                }, 200);
                
                // 成功トースト
                showToast('フォローしました！');
                
            } else {
                // フォロー解除
                button.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                button.classList.add('bg-blue-600', 'hover:bg-blue-700');
                
                button.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                    <span id="follow-text">フォローする</span>
                `;
                
                isFollowing = false;
                
                // フォロワー数を減らす
                const followersEl = document.getElementById('followers');
                const currentVal = parseFloat(followersEl.textContent);
                const newVal = currentVal - 0.1;
                
                followersEl.style.transition = 'all .2s ease';
                followersEl.style.color = '#334155';
                
                setTimeout(() => {
                    followersEl.textContent = newVal.toFixed(1) + 'k';
                    setTimeout(() => {
                        followersEl.style.color = '';
                    }, 400);
                }, 180);
            }
        }

        // メッセージモーダル
        function openMessageModal() {
            const modal = document.getElementById('message-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 入力フィールドにフォーカス
            setTimeout(() => {
                const subject = document.getElementById('message-subject');
                subject.focus();
                subject.select();
            }, 320);
        }

        function closeMessageModal(event) {
            const modal = document.getElementById('message-modal');
            if (!event || event.target === modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        function sendMessage() {
            const sendBtnText = document.getElementById('send-btn-text');
            const originalText = sendBtnText.textContent;
            
            sendBtnText.textContent = '送信中...';
            
            setTimeout(() => {
                const modal = document.getElementById('message-modal');
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                
                // 送信完了トースト
                showToast('メッセージを送信しました！');
                
                // ボタンをリセット
                sendBtnText.textContent = originalText;
                
                // 少し遅れてフォームをリセット
                setTimeout(() => {
                    document.getElementById('message-body').value = 'こんにちは。あなたのデザインに興味があり、プロジェクトについて少しお話できればと思います。';
                }, 1200);
            }, 1100);
        }

        // トースト通知
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            
            toastText.textContent = message;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            
            // 自動で消える
            setTimeout(() => {
                toast.style.transition = 'all 0.2s ease';
                toast.style.opacity = '0';
                
                setTimeout(() => {
                    toast.style.opacity = '1';
                    toast.style.transition = '';
                    toast.classList.remove('flex');
                    toast.classList.add('hidden');
                }, 200);
            }, 2600);
        }

        // キーボードショートカット
        function initKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    const modal = document.getElementById('message-modal');
                    if (modal.classList.contains('hidden')) {
                        openMessageModal();
                    }
                }
                
                if (e.key === 'Escape') {
                    const modal = document.getElementById('message-modal');
                    if (!modal.classList.contains('hidden')) {
                        modal.classList.remove('flex');
                        modal.classList.add('hidden');
                    }
                }
            });
            
            // ヒントを表示
            setTimeout(() => {
                const hint = document.createElement('div');
                hint.style.cssText = 'position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;';
                hint.className = 'text-blue-300/50 px-2 hidden md:block';
                hint.innerHTML = 'ヒント: "/" キーでメッセージを開く';
                
                const container = document.querySelector('.max-w-\\[380px\\]');
                if (container) {
                    container.style.position = 'relative';
                    container.appendChild(hint);
                    
                    setTimeout(() => {
                        if (hint.parentNode) hint.parentNode.removeChild(hint);
                    }, 4500);
                }
            }, 5000);
        }

        // スキルタグに軽いクリックエフェクト
        function initSkillTags() {
            const tags = document.querySelectorAll('.skill-tag');
            tags.forEach(tag => {
                tag.addEventListener('click', () => {
                    tag.style.transition = 'transform 0.1s ease';
                    tag.style.transform = 'scale(0.92)';
                    
                    setTimeout(() => {
                        tag.style.transform = 'scale(1)';
                    }, 120);
                    
                    // ランダムなアクションとしてツールチップ風
                    const originalText = tag.textContent;
                    if (originalText === 'Figma') {
                        showToast('FigmaでUI作成中');
                    } else if (originalText === 'UI/UX') {
                        showToast('ユーザー体験を重視');
                    }
                });
            });
        }

        // 初期化
        function initialize() {
            // 統計アニメーション
            initStats();
            
            // キーボードショートカット
            initKeyboardShortcuts();
            
            // スキルタグのインタラクション
            initSkillTags();
            
            // ページロード時の軽いアニメーション完了
            setTimeout(() => {
                const card = document.querySelector('.profile-card');
                if (card) {
                    card.style.boxShadow = '0 10px 15px -3px rgb(30 64 175 / 0.1), 0 4px 6px -4px rgb(30 64 175 / 0.1)';
                }
            }, 900);
            
            // デモ用：初回に軽くフォローできるように
            console.log('%c[Profile Card] シンプルで直感的なプロフィールカードが読み込まれました。', 'color:#64748b');
        }

        // ページ読み込み完了
        window.onload = initialize;
        
        // タッチデバイス対応の追加
        if ('ontouchstart' in window) {
            document.documentElement.style.setProperty('--tw-ring-color', 'rgba(59, 130, 246, 0.2)');
        }
    </script>
</body>
</html>
