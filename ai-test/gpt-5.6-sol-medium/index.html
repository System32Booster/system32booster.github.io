<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="青を基調にしたシンプルなプロフィールカード">
  <title>Profile Card | Aoi Mizuno</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      color-scheme: light;
      --blue: #1769e0;
      --blue-dark: #0a3c8c;
      --ink: #09264d;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(100, 181, 255, .6), transparent 28%),
        radial-gradient(circle at 85% 78%, rgba(38, 114, 229, .35), transparent 31%),
        linear-gradient(145deg, #eef8ff 0%, #d9ecff 48%, #bddcff 100%);
      color: var(--ink);
    }

    .ambient {
      position: fixed;
      border: 1px solid rgba(255, 255, 255, .52);
      border-radius: 999px;
      pointer-events: none;
      animation: drift 9s ease-in-out infinite;
    }

    .ambient-one {
      width: 21rem;
      height: 21rem;
      top: -8rem;
      right: -5rem;
      background: rgba(255, 255, 255, .14);
    }

    .ambient-two {
      width: 12rem;
      height: 12rem;
      left: -4rem;
      bottom: -3rem;
      background: rgba(35, 116, 226, .08);
      animation-delay: -4s;
    }

    .profile-card {
      position: relative;
      width: min(92vw, 28rem);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 2rem;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 28px 80px rgba(13, 75, 150, .18), 0 4px 14px rgba(13, 75, 150, .08);
      backdrop-filter: blur(22px);
      animation: card-in .85s cubic-bezier(.2, .8, .2, 1) both;
      transition: transform .35s ease, box-shadow .35s ease;
    }

    .profile-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 34px 90px rgba(13, 75, 150, .24), 0 5px 16px rgba(13, 75, 150, .1);
    }

    .cover {
      position: relative;
      height: 9rem;
      overflow: hidden;
      background: linear-gradient(130deg, #0a4298 0%, #1474e8 52%, #53aeff 100%);
    }

    .cover::before,
    .cover::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 999px;
    }

    .cover::before {
      width: 18rem;
      height: 18rem;
      right: -6rem;
      top: -11rem;
    }

    .cover::after {
      width: 8rem;
      height: 8rem;
      left: -2rem;
      bottom: -5rem;
      background: rgba(255, 255, 255, .08);
    }

    .avatar-wrap {
      width: 7rem;
      height: 7rem;
      margin-top: -3.5rem;
      padding: .32rem;
      position: relative;
      border-radius: 999px;
      background: white;
      box-shadow: 0 12px 28px rgba(9, 65, 135, .2);
    }

    .avatar {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      overflow: hidden;
      border-radius: inherit;
      background: linear-gradient(145deg, #d8efff, #90c8f8);
    }

    .status-dot {
      position: absolute;
      right: .45rem;
      bottom: .6rem;
      width: 1.15rem;
      height: 1.15rem;
      border: 3px solid white;
      border-radius: 50%;
      background: #2bc477;
    }

    .social-link {
      display: grid;
      width: 2.65rem;
      height: 2.65rem;
      place-items: center;
      border: 1px solid #d9e9fa;
      border-radius: 50%;
      color: #2469b8;
      background: #f7fbff;
      transition: transform .2s ease, color .2s ease, background .2s ease, border-color .2s ease;
    }

    .social-link:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
      color: white;
      background: var(--blue);
    }

    .follow-button {
      min-width: 9.25rem;
      border: 1px solid var(--blue);
      border-radius: .9rem;
      padding: .76rem 1.25rem;
      font-weight: 700;
      color: white;
      background: var(--blue);
      box-shadow: 0 10px 24px rgba(23, 105, 224, .25);
      transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .follow-button:hover { transform: translateY(-2px); }
    .follow-button:active { transform: scale(.97); }
    .follow-button.following {
      color: var(--blue);
      background: white;
      box-shadow: none;
    }

    .reveal {
      animation: content-in .7s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--delay);
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes content-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, 18px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="relative grid min-h-screen place-items-center px-4 py-10">
    <article class="profile-card" aria-labelledby="profile-name">
      <div class="cover" aria-hidden="true">
        <svg class="absolute right-7 top-6 opacity-50" width="78" height="45" viewBox="0 0 78 45" fill="none">
          <path d="M2 43C14 29 25 22 39 22C54 22 64 13 76 2" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <circle cx="39" cy="22" r="5" fill="white" fill-opacity=".5"/>
        </svg>
      </div>

      <div class="px-7 pb-8 sm:px-9">
        <div class="reveal avatar-wrap" style="--delay: .18s">
          <div class="avatar" role="img" aria-label="水野あおいのアバター">
            <svg width="104" height="104" viewBox="0 0 104 104" fill="none" aria-hidden="true">
              <circle cx="52" cy="45" r="23" fill="#FFE2C7"/>
              <path d="M29 43C30 23 41 15 54 16C69 16 78 27 76 46C70 41 66 34 63 28C56 37 43 43 29 43Z" fill="#173D69"/>
              <path d="M20 104C22 78 34 67 52 67C70 67 82 78 85 104H20Z" fill="#1769E0"/>
              <path d="M44 48C46 51 49 52 52 52C56 52 59 51 61 48" stroke="#CE8B72" stroke-width="2" stroke-linecap="round"/>
              <circle cx="43" cy="43" r="2" fill="#173D69"/>
              <circle cx="62" cy="43" r="2" fill="#173D69"/>
            </svg>
          </div>
          <span class="status-dot" aria-label="オンライン"></span>
        </div>

        <header class="reveal mt-5" style="--delay: .27s">
          <p class="mb-1 text-xs font-bold tracking-[.2em] text-blue-600">WEB DESIGNER</p>
          <h1 id="profile-name" class="text-2xl font-bold tracking-tight text-slate-900">水野 あおい</h1>
          <p class="mt-1 text-sm font-medium text-slate-500">Aoi Mizuno / Tokyo</p>
        </header>

        <p class="reveal mt-5 text-[15px] leading-7 text-slate-600" style="--delay: .36s">
          使う人の気持ちに寄り添う、シンプルで心地よいWeb体験をデザインしています。
        </p>

        <dl class="reveal mt-6 grid grid-cols-3 border-y border-blue-100 py-4 text-center" style="--delay: .45s">
          <div>
            <dt class="text-xs text-slate-500">Projects</dt>
            <dd class="mt-1 text-lg font-bold text-slate-900" data-count="24">0</dd>
          </div>
          <div class="border-x border-blue-100">
            <dt class="text-xs text-slate-500">Followers</dt>
            <dd class="mt-1 text-lg font-bold text-slate-900" data-count="860">0</dd>
          </div>
          <div>
            <dt class="text-xs text-slate-500">Following</dt>
            <dd class="mt-1 text-lg font-bold text-slate-900" data-count="128">0</dd>
          </div>
        </dl>

        <div class="reveal mt-6 flex items-center justify-between gap-4" style="--delay: .54s">
          <nav class="flex gap-2" aria-label="ソーシャルリンク">
            <a class="social-link" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="GitHubを開く">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.5v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.2 4.8 18.2 5 18.2 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.8 5.5-5.5 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.5A11.5 11.5 0 0 0 12 .7Z"/></svg>
            </a>
            <a class="social-link" href="https://www.linkedin.com/" target="_blank" rel="noreferrer" aria-label="LinkedInを開く">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.4 7.8H1V22h4.4V7.8ZM3.2 1A2.6 2.6 0 1 0 3.2 6a2.6 2.6 0 0 0 0-5ZM22 13.9c0-4.3-2.3-6.4-5.4-6.4-2.5 0-3.6 1.4-4.2 2.3v-2H8V22h4.4v-7c0-1.8.3-3.6 2.7-3.6 2.3 0 2.4 2.2 2.4 3.8V22H22v-8.1Z"/></svg>
            </a>
            <a class="social-link" href="mailto:hello@example.com" aria-label="メールを送る">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            </a>
          </nav>

          <button id="followButton" class="follow-button" type="button" aria-pressed="false">
            <span id="followLabel">フォローする</span>
          </button>
        </div>
      </div>
    </article>
  </main>

  <script>
    const followButton = document.getElementById('followButton');
    const followLabel = document.getElementById('followLabel');

    followButton.addEventListener('click', () => {
      const isFollowing = followButton.classList.toggle('following');
      followButton.setAttribute('aria-pressed', String(isFollowing));
      followLabel.textContent = isFollowing ? 'フォロー中' : 'フォローする';
    });

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('[data-count]').forEach((element) => {
      const target = Number(element.dataset.count);
      if (reduceMotion) {
        element.textContent = target.toLocaleString('ja-JP');
        return;
      }

      const duration = 900;
      const startTime = performance.now() + 350;
      const updateCount = (now) => {
        const progress = Math.min(Math.max((now - startTime) / duration, 0), 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        element.textContent = Math.floor(target * eased).toLocaleString('ja-JP');
        if (progress < 1) requestAnimationFrame(updateCount);
      };
      requestAnimationFrame(updateCount);
    });
  </script>
</body>
</html>
