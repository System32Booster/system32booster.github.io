<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<style>
  /* ===== 基本設定 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --txt:      #eaf3ff;
    --muted:    #9fbde3;
    --accent:   #4f9cf9;
    --accent-d: #2563eb;
    --line:     rgba(126, 180, 255, .16);
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 20px;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", sans-serif;
    color: var(--txt);
    background: #061426;
    overflow-x: hidden;
  }

  /* ===== 背景：ゆっくり動くグラデーション ===== */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -2;
    background:
      radial-gradient(circle at 20% 20%, #1b4f9c 0%, transparent 45%),
      radial-gradient(circle at 80% 75%, #0f3d7a 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #2563b8 0%, transparent 55%),
      linear-gradient(160deg, #061426, #0a2447 45%, #0d2f5e);
    background-size: 200% 200%;
    animation: bgShift 18s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    from { background-position: 0% 50%; }
    to   { background-position: 100% 50%; }
  }

  /* ===== 背景：ふわふわ浮く光の玉 ===== */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .35;
    z-index: -1;
    pointer-events: none;
  }
  .orb-1 {
    width: 320px; height: 320px;
    background: #3b82f6;
    top: -90px; left: -90px;
    animation: float1 14s ease-in-out infinite;
  }
  .orb-2 {
    width: 260px; height: 260px;
    background: #22d3ee;
    bottom: -70px; right: -70px;
    animation: float2 17s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(60px, 45px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-55px, -40px); }
  }

  /* ===== カード登場アニメーション ===== */
  .card-wrap {
    perspective: 1000px;
    animation: cardIn .9s cubic-bezier(.2, .8, .25, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(38px) scale(.95); }
    to   { opacity: 1; transform: none; }
  }

  /* ===== カード本体 ===== */
  .card {
    position: relative;
    width: min(360px, 92vw);
    padding: 32px 28px 26px;
    text-align: center;
    border-radius: 24px;
    border: 1px solid rgba(126, 180, 255, .22);
    background: linear-gradient(160deg,
                rgba(28, 66, 120, .82),
                rgba(10, 28, 54, .94));
    box-shadow:
      0 24px 60px -20px rgba(0, 20, 60, .95),
      inset 0 1px 0 rgba(255, 255, 255, .07);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform-style: preserve-3d;
    overflow: hidden;
    transition: box-shadow .3s ease;
  }
  .card:hover {
    box-shadow:
      0 34px 70px -22px rgba(30, 100, 220, .75),
      inset 0 1px 0 rgba(255, 255, 255, .12);
  }

  /* 光の帯がすっと通る演出 */
  .card::after {
    content: "";
    position: absolute;
    top: -60%; left: -70%;
    width: 55%; height: 220%;
    background: linear-gradient(90deg,
                transparent,
                rgba(150, 205, 255, .16),
                transparent);
    transform: rotate(18deg);
    animation: shine 6.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%        { left: -70%; }
    55%, 100% { left: 135%; }
  }

  /* ===== アバター ===== */
  .avatar-ring {
    position: relative;
    width: 112px; height: 112px;
    margin: 0 auto 18px;
    padding: 3px;
    display: grid;
    place-items: center;
    border-radius: 50%;
  }
  /* 回転するグラデーションのリング */
  .avatar-ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
                #4f9cf9, #22d3ee, #7cc0ff, #4f9cf9);
    animation: spin 6s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .avatar {
    position: relative;
    z-index: 1;
    width: 100%; height: 100%;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 3px solid #0b1f3a;
    background: linear-gradient(160deg, #1e4d8c, #0c2445);
    overflow: hidden;
  }

  /* オンライン状態のドット */
  .status {
    position: absolute;
    right: 6px; bottom: 6px;
    z-index: 2;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #34d399;
    border: 3px solid #0b1f3a;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .55); }
    50%      { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); }
  }

  /* ===== テキスト ===== */
  .name {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: .02em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ffffff, #9fd0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .role {
    display: inline-block;
    margin-bottom: 16px;
    padding: 4px 13px;
    font-size: .75rem;
    letter-spacing: .04em;
    color: #a9d2ff;
    background: rgba(79, 156, 249, .14);
    border: 1px solid rgba(79, 156, 249, .32);
    border-radius: 999px;
  }

  .bio {
    font-size: .84rem;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* ===== 統計 ===== */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    list-style: none;
    padding: 14px 0;
    margin-bottom: 20px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stats li {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stats li + li {
    border-left: 1px solid var(--line);
  }
  .stats strong {
    font-size: 1.05rem;
    color: #dceaff;
    font-variant-numeric: tabular-nums;
  }
  .stats span {
    font-size: .66rem;
    letter-spacing: .1em;
    color: #7f9ec4;
  }
  .stats strong.pop {
    animation: pop .35s ease;
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* ===== ボタン ===== */
  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .btn {
    flex: 1;
    padding: 11px 0;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 700;
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .28s ease,
                background .28s ease, color .2s ease;
  }
  .btn:active { transform: scale(.97); }

  .btn.primary {
    color: #fff;
    background: linear-gradient(135deg, #4f9cf9, #2563eb);
    box-shadow: 0 10px 24px -10px rgba(59, 130, 246, .95);
  }
  .btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 30px -12px rgba(59, 130, 246, 1);
  }
  /* フォロー済み状態 */
  .btn.primary.is-following {
    color: #a9d2ff;
    background: rgba(79, 156, 249, .1);
    border-color: rgba(79, 156, 249, .42);
    box-shadow: none;
  }

  .btn.ghost {
    color: #a9d2ff;
    background: rgba(79, 156, 249, .08);
    border-color: rgba(79, 156, 249, .35);
  }
  .btn.ghost:hover {
    background: rgba(79, 156, 249, .2);
    transform: translateY(-2px);
  }

  /* ===== SNS リンク ===== */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    list-style: none;
  }
  .socials a {
    display: grid;
    place-items: center;
    width: 40px; height: 40px;
    color: #9fc4ee;
    border-radius: 50%;
    background: rgba(126, 180, 255, .08);
    border: 1px solid rgba(126, 180, 255, .16);
    transition: all .25s cubic-bezier(.2, .8, .25, 1);
  }
  .socials a:hover {
    color: #fff;
    background: linear-gradient(135deg, #4f9cf9, #2563eb);
    border-color: transparent;
    transform: translateY(-4px) rotate(-6deg);
    box-shadow: 0 10px 20px -8px rgba(59, 130, 246, .95);
  }

  /* ===== アニメーションを控えめにする設定 ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

  <!-- 背景の光 -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card-wrap">
    <article class="card" id="card">

      <!-- アバター -->
      <div class="avatar-ring">
        <div class="avatar">
          <svg viewBox="0 0 24 24" width="54" height="54" fill="none"
               stroke="#8ec5ff" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8.5" r="4"/>
            <path d="M4.5 20c1.4-3.8 4.2-5.6 7.5-5.6s6.1 1.8 7.5 5.6"/>
          </svg>
        </div>
        <span class="status" title="オンライン"></span>
      </div>

      <!-- 名前・肩書き・自己紹介 -->
      <h1 class="name">蒼井 みなと</h1>
      <p class="role">Frontend Engineer / UI Designer</p>
      <p class="bio">
        使いやすくて、ちょっと心が動く。<br>
        そんなインターフェースをつくるのが好きです。
      </p>

      <!-- 統計 -->
      <ul class="stats">
        <li>
          <strong data-count="128">0</strong>
          <span>投稿</span>
        </li>
        <li>
          <strong data-count="2400" id="followers">0</strong>
          <span>フォロワー</span>
        </li>
        <li>
          <strong data-count="380">0</strong>
          <span>いいね</span>
        </li>
      </ul>

      <!-- ボタン -->
      <div class="actions">
        <button class="btn primary" id="followBtn">フォローする</button>
        <button class="btn ghost">メッセージ</button>
      </div>

      <!-- SNS -->
      <ul class="socials">
        <li>
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 5l14 14M19 5L5 19"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="#" aria-label="メール">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5.5" width="18" height="13" rx="2.5"/>
              <path d="M3.5 7.5l8.5 5.5 8.5-5.5"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="#" aria-label="ウェブサイト">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18"/>
              <path d="M12 3c2.9 3.6 2.9 14.4 0 18M12 3c-2.9 3.6-2.9 14.4 0 18"/>
            </svg>
          </a>
        </li>
      </ul>

    </article>
  </div>

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== 1. マウスに合わせてカードがふわっと傾く ===== */
  const card = document.getElementById('card');
  const wrap = document.querySelector('.card-wrap');

  if (!reduceMotion) {
    wrap.addEventListener('mouseenter', () => {
      card.style.transition = 'transform .1s ease-out, box-shadow .3s ease';
    });

    wrap.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width  - 0.5;  // -0.5 〜 0.5
      const y = (e.clientY - r.top)  / r.height - 0.5;
      card.style.transform =
        `rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateZ(8px)`;
    });

    wrap.addEventListener('mouseleave', () => {
      card.style.transition = 'transform .6s cubic-bezier(.2,.8,.25,1), box-shadow .3s ease';
      card.style.transform = '';
    });
  }

  /* ===== 2. 数字をカウントアップ ===== */
  function countUp(el, duration = 1300) {
    const target = Number(el.dataset.count);
    const start = performance.now();

    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);        // なめらかに減速
      el.textContent = Math.round(target * eased).toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // カードの登場アニメーションが終わってから開始
  window.addEventListener('load', () => {
    document.querySelectorAll('[data-count]').forEach((el, i) => {
      if (reduceMotion) {
        el.textContent = Number(el.dataset.count).toLocaleString();
        return;
      }
      setTimeout(() => countUp(el), 350 + i * 120);
    });
  });

  /* ===== 3. フォローボタンのトグル ===== */
  const followBtn  = document.getElementById('followBtn');
  const followersEl = document.getElementById('followers');
  let following = false;

  followBtn.addEventListener('click', () => {
    following = !following;

    followBtn.textContent = following ? 'フォロー中 ✓' : 'フォローする';
    followBtn.classList.toggle('is-following', following);

    // フォロワー数を増減させる
    const next = Number(followersEl.dataset.count) + (following ? 1 : -1);
    followersEl.dataset.count = next;
    followersEl.textContent = next.toLocaleString();

    // 数字をポンと弾ませる
    followersEl.classList.remove('pop');
    void followersEl.offsetWidth;   // リフローでアニメーションをリセット
    followersEl.classList.add('pop');
  });
</script>
</body>
</html>
