<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィールカード</title>
    <style>
        /* 基本設定 */
        :root {
            --primary-color: #2c3e50; /* 濃い青 */
            --accent-color: #3498db;  /* 明るい青 */
            --bg-gradient: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%);
            --shadow: 0 10px 30px rgba(44, 62, 80, 0.15);
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #333;
        }

        /* カード本体 */
        .card {
            background: #fff;
            width: 340px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            text-align: center;
            padding-bottom: 30px;
            
            /* 初期状態は少し下げて不透明にしておく（アニメーション用） */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 画像エリア */
        .card-header {
            background: linear-gradient(135deg, #2980b9 0%, #2c3e50 100%);
            height: 120px;
            position: relative;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #fff;
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* ホバー時の画像アニメーション */
        .card:hover .profile-img {
            transform: translateX(-50%) scale(1.05);
        }

        /* テキストエリア */
        .card-body {
            padding: 60px 20px 20px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-body {
            transform: translateY(-5px);
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 5px;
        }

        .role {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }

        /* ボタンエリア */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-outline:hover {
            background-color: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
        }

        /* スキルタグ（装飾用） */
        .tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 12px;
            background: #eef6fb;
            color: #2c3e50;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- プロフィールカード -->
    <div class="card">
        <div class="card-header">
            <!-- 画像はプレースホルダーを使用しています。src="画像のURL" に書き換えてください -->
            <img src="https://via.placeholder.com/150" alt="プロフィール画像" class="profile-img" id="profileImage">
        </div>
        <div class="card-body">
            <h2 class="name" id="name">山田 太郎</h2>
            <div class="role" id="role">Web デザイナー & プログラマー</div>
            
            <p class="description" id="bio">
                青を基調としたシンプルで使いやすいデザインを好みます。<br>
                常に新しい技術に触れながら、ユーザーにとって心地よい体験を提供することを目指しています。
            </p>

            <div class="tags">
                <span class="tag">HTML5</span>
                <span class="tag">CSS3</span>
                <span class="tag">JavaScript</span>
                <span class="tag">UI/UX</span>
            </div>

            <div class="social-links">
                <a href="#" class="btn btn-primary">連絡する</a>
                <a href="#" class="btn btn-outline">ポートフォリオ</a>
            </div>
        </div>
    </div>

    <script>
        // 必要に応じて、JavaScript で情報を動的に書き換えることができます
        document.addEventListener('DOMContentLoaded', () => {
            // 例：画像を少し遅延させて読み込むアニメーションの調整など
            const img = document.getElementById('profileImage');
            
            // 画像が実際に存在しない場合（プレースホルダー）でも、読み込みイベントを待たずに表示
            // 実際の画像にする場合は src="image.jpg" としてください
            
            console.log("プロフィールカードが読み込まれました");
        });

        // 任意：マウスの動きに合わせてカードを少し傾ける（3D 効果）
        const card = document.querySelector('.card');
        const container = document.querySelector('body');

        container.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // マウスが抜けたら元に戻す
        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'all 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });
    </script>
</body>
</html>
