<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルプロフィールカード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* カード本体 */
    .profile-card {
      width: 340px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      position: relative;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: cardAppear 0.8s ease-out forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 上部の青いヘッダー部分 */
    .card-header {
      height: 120px;
      background: linear-gradient(135deg, #1e40af, #3b82f6, #60a5fa);
      position: relative;
    }

    /* アバター */
    .avatar-wrapper {
      position: absolute;
      left: 50%;
      bottom: -50px;
      transform: translateX(-50%);
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 5px solid white;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      background: #e0f2fe;
      transition: transform 0.4s ease;
    }

    .profile-card:hover .avatar-wrapper {
      transform: translateX(-50%) scale(1.08) rotate(5deg);
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* コンテンツ部分 */
    .card-body {
      padding: 70px 28px 32px;
      text-align: center;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 0.95rem;
      color: #3b82f6;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .bio {
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* ソーシャルボタン */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e40af;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .social-btn:hover {
      background: #3b82f6;
      color: white;
      transform: translateY(-4px);
      box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
    }

    /* メインアクションボタン */
    .action-btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    /* 装飾用の光る円 */
    .glow {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.3) 0%, transparent 70%);
      top: -40px;
      right: -40px;
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* レスポンシブ */
    @media (max-width: 400px) {
      .profile-card {
        width: 90%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="glow"></div>
    <div class="card-header">
      <div class="avatar-wrapper">
        <!-- 好きな画像URLに変更してください -->
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=BlueUser&backgroundColor=b6e3f4" 
             alt="プロフィール画像" 
             class="avatar">
      </div>
    </div>

    <div class="card-body">
      <h1 class="name">青空 太郎</h1>
      <p class="title">フロントエンドエンジニア</p>
      <p class="bio">
        シンプルで美しいUIを作ることが好きです。<br>
        青が大好きなエンジニアです。
      </p>

      <div class="social-links">
        <a href="#" class="social-btn" title="Twitter / X">𝕏</a>
        <a href="#" class="social-btn" title="GitHub">GH</a>
        <a href="#" class="social-btn" title="メール">✉</a>
      </div>

      <button class="action-btn" id="contactBtn">メッセージを送る</button>
    </div>
  </div>

  <script>
    // ボタンクリック時の簡単なインタラクション
    const contactBtn = document.getElementById('contactBtn');

    contactBtn.addEventListener('click', () => {
      // ボタンの一時的なフィードバック
      contactBtn.textContent = '送信しました！';
      contactBtn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
      
      setTimeout(() => {
        contactBtn.textContent = 'メッセージを送る';
        contactBtn.style.background = '';
      }, 2000);
    });

    // カードにマウスが入ったときのちょっとしたエフェクト（任意）
    const card = document.querySelector('.profile-card');
    card.addEventListener('mouseenter', () => {
      card.style.transition = 'transform 0.3s ease, box-shadow 0.3s ease';
    });
  </script>
</body>
</html>
