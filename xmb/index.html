<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XMB — XrossMediaBar</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; overflow:hidden;
    background:#04060c; color:#fff;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,
                system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none; cursor:default;
  }
  body.booting #stage, body.booting .hud, body.booting .hint{
    opacity:0; pointer-events:none;
  }
  #bg{ position:fixed; inset:0; display:block; z-index:0; }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 60% at 50% 50%,
        rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.82) 100%),
      linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 22%,
                              rgba(0,0,0,0) 70%, rgba(0,0,0,.65) 100%);
  }
  #stage{
    position:fixed; inset:0; z-index:10;
    transition: opacity .9s ease, filter .9s ease;
  }
  body.overlay-on #stage, body.game-on #stage{
    opacity:0; filter:blur(10px); pointer-events:none;
  }
  body.overlay-on .hud, body.overlay-on .hint,
  body.game-on .hud, body.game-on .hint{ opacity:0 !important; }
  .cat{
    position:absolute; left:50%; top:50%;
    width:64px; height:64px;
    display:grid; place-items:center;
    color:#7890aa; cursor:pointer;
    transform:translate(-50%,-50%) scale(.35); opacity:0;
    transition:
      transform .5s cubic-bezier(.22,.61,.36,1),
      opacity   .45s ease, color .35s ease, filter .35s ease;
    z-index:20;
  }
  .cat .cat-icon{ display:grid; place-items:center; width:52px; height:52px; }
  .cat .cat-icon svg{ width:100%; height:100%; display:block; }
  .cat .cat-label{
    position:absolute; top:calc(100% + 8px); left:50%;
    transform:translateX(-50%); white-space:nowrap;
    font-size:11px; letter-spacing:.16em; color:#dbe9f7;
    text-shadow:0 0 10px rgba(0,0,0,.9), 0 0 22px rgba(80,150,220,.6);
    opacity:0; transition:opacity .35s ease; pointer-events:none;
  }
  .cat.active{
    color:#ffffff;
    filter:drop-shadow(0 0 10px rgba(150,215,255,.9))
           drop-shadow(0 0 26px rgba(70,150,230,.55));
  }
  .cat.active .cat-label{ opacity:.92; }
  .items{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .32s ease; z-index:15;
  }
  .items.active{ opacity:1; pointer-events:auto; }
  .item{
    position:absolute; left:calc(50% - 22px); top:50%;
    min-height:44px; display:flex; align-items:center; gap:16px;
    color:#8ba1b9; cursor:pointer;
    transform-origin:22px 50%;
    transform:translateY(-50%) scale(.4); opacity:0;
    transition:
      transform .45s cubic-bezier(.22,.61,.36,1),
      opacity   .35s ease, color .3s ease, filter .3s ease;
  }
  .item .item-icon{
    flex:0 0 auto; width:44px; height:44px;
    display:grid; place-items:center;
  }
  .item .item-icon svg,
  .item .item-icon img{
    width:34px; height:34px; display:block;
    object-fit:contain;
    border-radius:4px;
  }
  .item .item-label{
    display:flex; flex-direction:column; gap:1px; line-height:1.2;
    text-shadow:0 1px 8px rgba(0,0,0,.9);
  }
  .item .item-name{
    font-size:15px; letter-spacing:.05em;
    transition:font-size .3s ease, font-weight .3s ease;
    white-space:nowrap;
  }
  .item .item-sub{
    font-size:10px; letter-spacing:.16em; color:#7e93aa;
    transition:color .3s ease;
  }
  .item.sel .item-name{ font-size:17px; font-weight:500; }
  .item.sel .item-sub{ color:#c6d6e6; }
  .item .item-desc{
    position:absolute; top:calc(100% + 4px); left:60px;
    width:max-content; max-width:min(520px, 46vw);
    font-size:12px; line-height:1.55; letter-spacing:.02em;
    color:#c6d6e6; text-shadow:0 1px 6px rgba(0,0,0,.9);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease; white-space:normal;
  }
  .item.sel .item-desc{ opacity:1; }
  .item.sel{
    color:#ffffff;
    filter:drop-shadow(0 0 9px rgba(150,215,255,.55));
  }
  .item.sel .item-icon svg,
  .item.sel .item-icon img{
    filter:drop-shadow(0 0 8px rgba(140,210,255,.9));
  }
  .submenu{
    position:absolute; top:50%; left:calc(50% + 240px);
    transform:translateY(-50%) translateX(-18px);
    opacity:0; pointer-events:none;
    display:flex; flex-direction:column; gap:2px;
    max-height:82vh; overflow-y:auto; padding:8px 0;
    transition: opacity .26s ease,
                transform .32s cubic-bezier(.22,.61,.36,1);
    z-index:60; scrollbar-width:none;
  }
  .submenu::-webkit-scrollbar{ display:none; }
  .submenu.active{
    opacity:1; transform:translateY(-50%) translateX(0);
    pointer-events:auto;
  }
  .sub-item{
    display:flex; align-items:flex-start; gap:14px;
    padding:9px 26px 9px 14px;
    min-width:420px; max-width:min(600px, 44vw);
    color:#8ba1b9; border-radius:6px; cursor:pointer;
    transition: color .2s ease, background .25s ease, box-shadow .25s ease;
    position:relative;
  }
  .sub-item .sub-icon{
    flex:0 0 auto; width:26px; height:26px; margin-top:1px;
    display:grid; place-items:center;
  }
  .sub-item .sub-icon svg,
  .sub-item .sub-icon img{
    width:22px; height:22px; display:block;
    object-fit:contain;
    border-radius:3px;
  }
  .sub-item .sub-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .sub-top{
    display:flex; align-items:baseline;
    justify-content:space-between; gap:32px;
  }
  .sub-item .sub-label{
    font-size:14px; letter-spacing:.04em; white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.9);
  }
  .sub-item .sub-value{
    font-size:13px; letter-spacing:.04em; color:#b8cce0;
    white-space:nowrap; text-shadow:0 1px 6px rgba(0,0,0,.9);
  }
  .sub-item .sub-desc{
    font-size:11px; line-height:1.55; letter-spacing:.02em;
    color:#a8bdd2; opacity:0; max-height:0; overflow:hidden;
    transition:opacity .25s ease, max-height .32s ease, margin-top .32s ease;
    text-shadow:0 1px 4px rgba(0,0,0,.9);
  }
  .sub-item.sel{
    color:#ffffff;
    background:linear-gradient(90deg,
      rgba(90,170,255,.22) 0%,
      rgba(90,170,255,.06) 70%,
      rgba(90,170,255,0) 100%);
    transform:translateX(4px);
    box-shadow:-2px 0 0 0 rgba(150,215,255,.9);
  }
  .sub-item.sel .sub-icon svg,
  .sub-item.sel .sub-icon img{
    filter:drop-shadow(0 0 6px rgba(150,215,255,.9));
  }
  .sub-item.sel .sub-value{ color:#e0ecf8; }
  .sub-item.sel .sub-desc{ opacity:1; max-height:120px; margin-top:5px; }
  .hud{
    position:fixed; inset:0; z-index:100; pointer-events:none;
    padding:22px 30px;
    display:flex; justify-content:flex-end; align-items:flex-start;
    transition:opacity .38s ease;
  }
  .clock-box{ text-align:right; line-height:1.15; }
  .clock{
    font-size:30px; font-weight:300; letter-spacing:.06em;
    text-shadow:0 0 18px rgba(120,180,255,.5), 0 2px 6px rgba(0,0,0,.8);
  }
  .date{
    font-size:12px; letter-spacing:.14em; color:#a8c2da;
    text-shadow:0 2px 6px rgba(0,0,0,.8);
  }
  .hint{
    position:fixed; left:50%; bottom:20px;
    transform:translateX(-50%); z-index:100;
    font-size:11px; letter-spacing:.18em;
    color:#7f9ab5; opacity:.5; pointer-events:none;
    white-space:nowrap; transition:opacity .6s ease;
  }
  .toast{
    position:fixed; left:50%; bottom:62px;
    transform:translate(-50%, 14px); z-index:120;
    padding:9px 22px; border-radius:999px;
    font-size:13px; letter-spacing:.08em; color:#eaf4ff;
    background:rgba(20,38,60,.55);
    border:1px solid rgba(130,195,255,.28);
    box-shadow:0 0 26px rgba(60,140,220,.35), inset 0 0 20px rgba(80,160,255,.12);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .overlay{
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity .42s ease;
    background:rgba(6, 10, 20, 0.45);
    backdrop-filter: blur(22px) brightness(0.55) saturate(1.1);
    -webkit-backdrop-filter: blur(22px) brightness(0.55) saturate(1.1);
  }
  body.overlay-on .overlay{ opacity:1; pointer-events:auto; }
  .overlay-top-line, .overlay-bottom-line{
    height:1px;
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 18%,
      rgba(255,255,255,.4) 50%, rgba(255,255,255,.28) 82%,
      rgba(255,255,255,0) 100%);
    box-shadow:0 0 14px rgba(190,220,255,.35);
  }
  .overlay-top-line{ margin-top:16vh; }
  .overlay-bottom-line{ margin-bottom:14vh; }
  .overlay-content{
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:46px; padding:0 40px;
  }
  .overlay-text{
    font-size:20px; letter-spacing:.14em;
    color:#fff; text-align:center;
    text-shadow:
      0 2px 14px rgba(0,0,0,.85),
      0 0 40px rgba(180,220,255,.25);
    white-space:pre-line; line-height:1.75; font-weight:400;
  }
  .overlay-options{
    display:flex; gap:90px;
    justify-content:center; align-items:center;
  }
  .overlay-opt{
    position:relative; padding:12px 30px;
    font-size:20px; letter-spacing:.18em;
    color:#c4cfdd; background:none; border:none;
    font-family:inherit; cursor:pointer;
    transition: color .25s ease, text-shadow .25s ease;
    text-shadow:0 2px 10px rgba(0,0,0,.8); font-weight:400;
  }
  .overlay-opt.sel{
    color:#ffffff;
    text-shadow:
      0 0 16px rgba(255,255,255,.85),
      0 0 40px rgba(180,220,255,.55),
      0 2px 10px rgba(0,0,0,.85);
  }
  .overlay-opt.sel::before{
    content:''; position:absolute; inset:0;
    border-radius:10px;
    background:radial-gradient(ellipse at center,
      rgba(255,255,255,.18) 0%,
      rgba(200,225,255,.06) 60%, transparent 100%);
    box-shadow:0 0 26px rgba(160,210,255,.28);
    pointer-events:none;
  }
  .overlay-footer{
    display:flex; justify-content:center; gap:120px;
    padding:22px 40px 34px;
    font-size:13px; letter-spacing:.16em; color:#c4cfdd;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  .footer-hint{ display:flex; align-items:center; gap:10px; }
  .footer-hint .btn-icon{
    display:inline-grid; place-items:center;
    width:22px; height:22px; border-radius:50%;
    border:1.5px solid currentColor;
    font-size:11px; line-height:1;
  }

  /* ---------- splash ---------- */
  .splash{
    position:fixed; inset:0; z-index:1000; overflow:hidden;
    opacity:1; transition:opacity 1.1s ease; pointer-events:none;
  }
  .splash::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 90% 80% at 50% 50%,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.15) 55%, rgba(0,0,0,.5) 100%);
    pointer-events:none;
  }
  .splash.hide{ opacity:0; }
  .splash-logo{
    position:absolute; right:7%; top:47%;
    transform: translateY(-50%) translateX(110px) scale(.96);
    opacity:0; display:flex; align-items:center;
    gap: clamp(18px, 2vw, 38px);
    transition:
      opacity 1.5s ease,
      transform 1.9s cubic-bezier(.18,.7,.3,1);
    pointer-events:none;
    filter: drop-shadow(0 0 26px rgba(160,210,255,.28));
  }
  .splash.logo-in .splash-logo{
    opacity:1; transform: translateY(-50%) translateX(0) scale(1);
  }
  .splash.warning-phase .splash-logo{
    opacity:0; transform: translateY(-50%) translateX(70px) scale(.97);
    transition: opacity .7s ease, transform .9s ease;
  }
  .ps-symbol{
    width: clamp(70px, 7.6vw, 118px);
    height: clamp(96px, 10.4vw, 152px);
    color:#eef4fb; flex:0 0 auto;
  }
  .ps-symbol svg{ width:100%; height:100%; display:block; }
  .ps3-brand{
    display:flex; flex-direction:column;
    align-items:flex-start; line-height:1;
  }
  .ps3-big{
    font-family: "Arial Black","Helvetica Neue","Hiragino Kaku Gothic ProN",
                 "Yu Gothic", sans-serif;
    font-weight: 900;
    font-size: clamp(72px, 9.6vw, 148px);
    letter-spacing: -0.035em; line-height: 0.88;
    color:#f2f7fc;
    transform: scaleX(1.16); transform-origin: left center;
    text-shadow:
      0 0 32px rgba(190,225,255,.42),
      0 0 70px rgba(120,180,255,.28),
      0 2px 10px rgba(0,0,0,.55);
    margin-bottom: clamp(8px, 1vw, 14px);
  }
  .ps3-sub{
    margin-left: 4px;
    font-size: clamp(16px, 1.55vw, 26px);
    font-weight: 400; letter-spacing: .015em;
    color:#d4dfeb;
    text-shadow:
      0 0 14px rgba(170,215,255,.4),
      0 1px 4px rgba(0,0,0,.55);
  }
  .splash-warning{
    position:absolute; left:50%; top:50%;
    transform: translate(-50%, calc(-50% + 22px));
    width: min(940px, 74vw); text-align:left;
    color:#fff; opacity:0; pointer-events:none;
    transition: opacity 1.3s ease, transform 1.3s ease;
  }
  .splash-warning::before{
    content:''; position:absolute; inset:-40px -60px;
    background:radial-gradient(ellipse 70% 60% at 50% 50%,
      rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,0) 100%);
    pointer-events:none; z-index:-1; border-radius:24px;
  }
  .splash.warning-in .splash-warning{
    opacity:1; transform: translate(-50%, -50%);
  }
  .splash-warning h2{
    font-size: clamp(15px, 1.25vw, 19px);
    font-weight: 500; letter-spacing: .08em;
    margin-bottom: 14px; color:#ffffff;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
  }
  .splash-warning p{
    font-size: clamp(13px, 1.05vw, 16px);
    line-height: 1.9; letter-spacing: .04em;
    color:#f8fafc;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
  }
  .splash-skip-hint{
    position:absolute; right: 28px; bottom: 22px;
    font-size: 11px; letter-spacing: .18em;
    color: rgba(255,255,255,.32);
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    opacity:0; transition: opacity .8s ease;
    pointer-events:none;
  }
  .splash.logo-in .splash-skip-hint,
  .splash.warning-in .splash-skip-hint{
    opacity:1; transition-delay: 1.4s;
  }
  .poweroff-screen{
    position:fixed; inset:0; z-index:1500; background:#000;
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease;
    display:grid; place-items:center;
  }
  .poweroff-screen.active{ opacity:1; pointer-events:auto; }
  .poweroff-hint{
    font-size:13px; letter-spacing:.28em;
    color:rgba(255,255,255,.65);
    opacity:0; text-align:center; line-height:2;
    padding:0 30px;
  }
  .poweroff-screen.show-hint .poweroff-hint{
    animation:
      hint-fade-in .9s ease-out forwards,
      hint-pulse 2.6s ease-in-out 1s infinite;
  }
  @keyframes hint-fade-in{ 0%{opacity:0;} 100%{opacity:.6;} }
  @keyframes hint-pulse{ 0%,100%{opacity:.6;} 50%{opacity:.95;} }

  /* ---------- game screen ---------- */
  .game-screen{
    position:fixed; inset:0; z-index:250;
    display:grid; place-items:center;
    background:
      radial-gradient(ellipse 80% 70% at 50% 45%,
        rgba(12,32,58,.92) 0%,
        rgba(4,10,22,.97) 60%,
        rgba(2,5,12,.99) 100%);
    backdrop-filter: blur(14px) brightness(0.6);
    -webkit-backdrop-filter: blur(14px) brightness(0.6);
    opacity:0; pointer-events:none;
    transition:opacity .42s ease;
  }
  body.game-on .game-screen{ opacity:1; pointer-events:auto; }

  .game-frame{
    min-width: 520px;
    padding: 22px 32px 26px;
    border-radius: 12px;
    background: linear-gradient(180deg,
      rgba(28,58,100,.6),
      rgba(8,20,40,.92));
    border: 1px solid rgba(130,195,255,.32);
    box-shadow:
      0 0 70px rgba(50,130,220,.35),
      inset 0 0 50px rgba(70,150,255,.08);
    transform:scale(.94);
    transition:transform .4s cubic-bezier(.22,.61,.36,1);
  }
  body.game-on .game-frame{ transform:scale(1); }

  .game-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-bottom:12px;
    border-bottom:1px solid rgba(130,195,255,.2);
    margin-bottom:16px;
  }
  .game-title{
    font-size:16px;
    letter-spacing:.18em;
    color:#cfe6ff;
    text-shadow:0 0 14px rgba(120,190,255,.5);
  }
  .game-hint{
    font-size:11px;
    letter-spacing:.16em;
    color:#7f9ab5;
  }
  .game-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .game-status{
    font-size:14px;
    letter-spacing:.1em;
    color:#e6f2ff;
    text-shadow:0 0 12px rgba(120,190,255,.4);
    text-align:center;
    min-height:1.4em;
  }
  .game-hint-line{
    font-size:11px;
    letter-spacing:.14em;
    color:#8ba8c5;
    text-align:center;
  }

  /* tic-tac-toe */
  .ttt-board{
    display:grid;
    grid-template-columns:repeat(3, 96px);
    grid-template-rows:repeat(3, 96px);
    gap:6px;
    margin: 6px 0;
  }
  .ttt-cell{
    display:grid; place-items:center;
    font-size:56px;
    font-weight:700;
    color:#cfe6ff;
    background:rgba(30,60,100,.42);
    border:1px solid rgba(130,195,255,.28);
    border-radius:8px;
    cursor:pointer;
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
    text-shadow:0 0 18px rgba(150,215,255,.55);
    line-height:1;
  }
  .ttt-cell:hover{
    background:rgba(60,110,170,.55);
    border-color:rgba(160,215,255,.55);
  }
  .ttt-cell.filled{ cursor:default; }
  .ttt-cell.filled:hover{ background:rgba(30,60,100,.42); border-color:rgba(130,195,255,.28); }
  .ttt-cell.o{ color:#7ec8ff; text-shadow:0 0 22px rgba(120,200,255,.9); }
  .ttt-cell.x{ color:#ffb970; text-shadow:0 0 22px rgba(255,180,100,.9); }
  .ttt-cell.win{
    background:rgba(120,220,140,.25);
    border-color:rgba(160,255,180,.7);
    box-shadow:0 0 24px rgba(140,240,170,.55);
  }
  .ttt-cell.cursor{
    outline:2px solid rgba(200,230,255,.9);
    outline-offset:-2px;
  }

  /* snake */
  .snake-canvas{
    display:block;
    border-radius:8px;
    background:rgba(8,20,40,.9);
    border:1px solid rgba(130,195,255,.3);
    box-shadow:inset 0 0 40px rgba(50,120,200,.15);
    max-width:80vw;
    max-height:55vh;
  }

  @media (max-width:760px){
    .clock{ font-size:22px; }
    .hint{ font-size:9px; letter-spacing:.1em; }
    .item .item-name{ font-size:13px; }
    .item.sel .item-name{ font-size:15px; }
    .item .item-desc{ font-size:11px; max-width:56vw; }
    .overlay-text{ font-size:16px; }
    .overlay-options{ gap:56px; }
    .overlay-opt{ font-size:16px; padding:10px 20px; }
    .overlay-footer{ gap:60px; font-size:11px; }
    .overlay-top-line{ margin-top:12vh; }
    .overlay-bottom-line{ margin-bottom:10vh; }
    .submenu{ left:auto; right:16px; }
    .sub-item{ min-width:0; max-width:70vw; }
    .splash-logo{ right: 5%; }
    .splash-warning{ width: 84vw; }
    .game-frame{ min-width:0; width:88vw; padding:16px 18px; }
    .ttt-board{ grid-template-columns:repeat(3, 72px); grid-template-rows:repeat(3, 72px); }
    .ttt-cell{ font-size:42px; }
  }
</style>
</head>
<body class="booting">

<canvas id="bg"></canvas>
<div class="vignette"></div>
<div id="stage"></div>

<div class="hud">
  <div class="clock-box">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
</div>

<div class="hint" id="hint">← → カテゴリ　↑ ↓ 項目　Enter 決定　Esc 戻る</div>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="overlay-top-line"></div>

function svgIcon(name){
  const p = ICONS[name] || ICONS.disc;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ============================================================
   アイコン描画（SVG or 画像）
   ------------------------------------------------------------
   item.iconUrl があればそれを <img> で表示し、
   読み込み失敗時は item.i の SVG へ自動フォールバック。
   ============================================================ */
function iconMarkup(it, imgCls){
  if (it.iconUrl){
    const fallback = it.i || 'disc';
    return `<img class="${imgCls}" src="${it.iconUrl}" data-fallback="${fallback}" alt="">`;
  }
  return svgIcon(it.i);
}

function attachIconFallbacks(root){
  root.querySelectorAll('img[data-fallback]').forEach(img => {
    if (img.dataset.bound) return;
    img.dataset.bound = '1';
    img.addEventListener('error', () => {
      const svg = svgIcon(img.dataset.fallback);
      const wrap = document.createElement('span');
      wrap.innerHTML = svg;
      img.replaceWith(wrap.firstElementChild);
    });
  });
}

/* =========================================================
   定数 / 状態
   ========================================================= */
const CAT_W = 116;
const ITEM_H = 88;
const ITEM_OFFSET = 86;

const state = {
  cat: 0,
  idx: DATA.map(() => 0),
  mode: 'xmb',
  sub: { items: [], index: 0 },
  subStack: [],
  overlay: null,
  overlayOptions: [],
  overlaySelection: 0,
  prevMode: 'xmb',
  activeGame: null
};

/* =========================================================
   DOM 参照
   ========================================================= */
const stage    = document.getElementById('stage');
const toastEl  = document.getElementById('toast');
const clockEl  = document.getElementById('clock');
const dateEl   = document.getElementById('date');
const hintEl   = document.getElementById('hint');
const splashEl = document.getElementById('splash');
const poweroffEl = document.getElementById('poweroffScreen');
const gameScreenEl = document.getElementById('gameScreen');
const gameTitleEl  = document.getElementById('gameTitle');
const gameBodyEl   = document.getElementById('gameBody');

const overlayEl  = document.getElementById('overlay');
const ovTextEl   = document.getElementById('ovText');
const ovOptionsEl= document.getElementById('ovOptions');
const ovFooterEl = document.getElementById('ovFooter');

const submenuEl = document.createElement('div');
submenuEl.className = 'submenu';
stage.appendChild(submenuEl);

const catEls     = [];
const itemGroups = [];

DATA.forEach((cat, ci) => {
  const el = document.createElement('div');
  el.className = 'cat';
  el.innerHTML =
    `<div class="cat-icon">${svgIcon(cat.icon)}</div>` +
    `<div class="cat-label">${cat.name}</div>`;
  el.addEventListener('click', ev => {
    ev.stopPropagation();
    ensureAudio();
    if (isBooting() || state.mode !== 'xmb') return;
    if (state.cat === ci) return;
    state.cat = ci;
    sfx('move');
    render();
  });
  stage.appendChild(el);
  catEls.push(el);

  const wrap = document.createElement('div');
  wrap.className = 'items';

  const els = cat.items.map((it, ii) => {
    const ie = document.createElement('div');
    ie.className = 'item';
    ie.innerHTML =
      `<div class="item-icon">${iconMarkup(it, 'item-icon-img')}</div>` +
      `<div class="item-label">` +
        `<span class="item-name">${it.t}</span>` +
        (it.sub ? `<span class="item-sub">${it.sub}</span>` : '') +
      `</div>` +
      (it.desc ? `<div class="item-desc">${it.desc}</div>` : '');
    attachIconFallbacks(ie);

    ie.addEventListener('click', ev => {
      ev.stopPropagation();
      ensureAudio();
      if (isBooting() || state.mode !== 'xmb') return;
      state.idx[ci] = ii;
      render();
      confirm();
    });
    wrap.appendChild(ie);
    return ie;
  });

  stage.appendChild(wrap);
  itemGroups.push({ wrap, els });
});

/* =========================================================
   XMB 描画
   ========================================================= */
function render(){
  const c = state.cat;
  catEls.forEach((el, i) => {
    const d  = i - c;
    const ad = Math.abs(d);
    const x  = d * CAT_W;
    const sc = d === 0 ? 1 : (ad === 1 ? 0.86 : 0.74);
    const op = d === 0 ? 1 : Math.max(0.12, 0.6 - (ad - 1) * 0.13);
    el.style.transform = `translate(-50%,-50%) translateX(${x}px) scale(${sc})`;
    el.style.opacity   = op;
    el.style.zIndex    = 30 - ad;
    el.classList.toggle('active', d === 0);
  });
  itemGroups.forEach((g, gi) => {
    const active = gi === c;
    g.wrap.classList.toggle('active', active);
    const sel = state.idx[gi];
    g.els.forEach((el, i) => {
      const k  = i - sel;
      const y  = k * ITEM_H + ITEM_OFFSET;
      const sc = (k === 0) ? 1 : 0.88;
      const op = k < 0 ? Math.max(0, 1 + k * 0.45)
                       : Math.max(0, 1 - k * 0.16);
      el.style.transform = `translate(0, calc(-50% + ${y}px)) scale(${sc})`;
      el.style.opacity   = op;
      el.classList.toggle('sel', k === 0);
      el.style.pointerEvents = (k >= 0 && k <= 6) ? 'auto' : 'none';
    });
  });
}

/* =========================================================
   サブメニュー
   ========================================================= */
function openSubmenu(menu){
  if (state.mode === 'submenu'){
    state.subStack.push({ items: state.sub.items, index: state.sub.index });
  }
  state.mode = 'submenu';
  state.sub  = { items: menu, index: 0 };
  renderSubmenu();
  requestAnimationFrame(() => positionSubmenu());
  submenuEl.classList.add('active');
  updateHint();
  sfx('ok');
}
function renderSubmenu(){
  submenuEl.innerHTML = '';
  state.sub.items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'sub-item' + (i === state.sub.index ? ' sel' : '');
    el.innerHTML =
      `<div class="sub-icon">${iconMarkup(it, 'sub-icon-img')}</div>` +
      `<div class="sub-body">` +
        `<div class="sub-top">` +
          `<div class="sub-label">${it.t}</div>` +
          (it.value != null ? `<div class="sub-value">${it.value}</div>` : '') +
        `</div>` +
        (it.desc ? `<div class="sub-desc">${it.desc}</div>` : '') +
      `</div>`;
    attachIconFallbacks(el);
    el.addEventListener('mouseenter', () => {
      if (state.mode !== 'submenu') return;
      state.sub.index = i;
      updateSubSelection();
    });
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      ensureAudio();
      if (isBooting() || state.mode !== 'submenu') return;
      state.sub.index = i;
      updateSubSelection();
      confirmSub();
    });
    submenuEl.appendChild(el);
  });
}
function updateSubSelection(){
  const els = submenuEl.querySelectorAll('.sub-item');
  els.forEach((el, i) => el.classList.toggle('sel', i === state.sub.index));
}
function positionSubmenu(){
  const selEl = itemGroups[state.cat].els[state.idx[state.cat]];
  if (!selEl) return;
  const labelEl = selEl.querySelector('.item-label');
  if (!labelEl) return;
  const labelRect = labelEl.getBoundingClientRect();
  const itemRect  = selEl.getBoundingClientRect();
  const subLeft = labelRect.right + 34;
  const subTop  = itemRect.top + itemRect.height / 2;
  const maxLeft = window.innerWidth - 480;
  submenuEl.style.left = Math.min(subLeft, maxLeft) + 'px';
  submenuEl.style.top  = subTop + 'px';
}
function closeSubmenu(){
  sfx('back');
  if (state.subStack.length > 0){
    const prev = state.subStack.pop();
    state.sub = prev;
    renderSubmenu();
    requestAnimationFrame(() => positionSubmenu());
    return;
  }
  state.mode = 'xmb';
  submenuEl.classList.remove('active');
  updateHint();
}
function moveSub(dir){
  const ni = state.sub.index + dir;
  if (ni < 0 || ni >= state.sub.items.length){ sfx('edge'); return; }
  state.sub.index = ni;
  updateSubSelection();
  sfx('move');
}
function confirmSub(){
  const item = state.sub.items[state.sub.index];
  if (item.action && item.action.menu){ openSubmenu(item.action.menu); return; }
  if (item.action && item.action.game){ startGame(item.action.game); return; }
  if (item.action && item.action.message){
    sfx('ok'); showOverlay(item.action.message); return;
  }
  sfx('ok'); showToast(item.t); flashSubItem();
}
function flashSubItem(){
  const el = submenuEl.querySelectorAll('.sub-item')[state.sub.index];
  if (el && el.animate){
    el.animate(
      [ { filter:'brightness(2.4) drop-shadow(0 0 18px rgba(180,230,255,.95))' },
        { filter:'brightness(1)' } ],
      { duration: 420, easing:'ease-out' }
    );
  }
}

/* =========================================================
   オーバーレイ
   ========================================================= */
function showOverlay(msg){
  state.prevMode = state.mode;
  state.mode = 'overlay';
  state.overlay = msg;
  ovTextEl.textContent = msg.text || '';
  let opts;
  if (msg.type === 'info'){ opts = [ msg.okLabel || 'OK' ]; }
  else { opts = [ msg.confirmLabel || 'はい', msg.cancelLabel || 'いいえ' ]; }
  state.overlayOptions   = opts;
  state.overlaySelection = 0;
  renderOverlayOptions();
  renderOverlayFooter(msg.type === 'info');
  document.body.classList.add('overlay-on');
  updateHint();
}
function renderOverlayOptions(){
  ovOptionsEl.innerHTML = '';
  state.overlayOptions.forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'overlay-opt' + (i === state.overlaySelection ? ' sel' : '');
    btn.textContent = label;
    btn.addEventListener('mouseenter', () => {
      if (state.mode !== 'overlay') return;
      state.overlaySelection = i;
      updateOverlaySelection();
    });
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      ensureAudio();
      if (state.mode !== 'overlay') return;
      state.overlaySelection = i;
      updateOverlaySelection();
      confirmOverlay();
    });
    ovOptionsEl.appendChild(btn);
  });
}
function renderOverlayFooter(isInfo){
  if (isInfo){
    ovFooterEl.innerHTML =
      `<div class="footer-hint"><span class="btn-icon">✕</span><span>OK</span></div>`;
  } else {
    ovFooterEl.innerHTML =
      `<div class="footer-hint"><span class="btn-icon">✕</span><span>決定</span></div>` +
      `<div class="footer-hint"><span class="btn-icon">○</span><span>戻る</span></div>`;
  }
}
function updateOverlaySelection(){
  const els = ovOptionsEl.querySelectorAll('.overlay-opt');
  els.forEach((el, i) => el.classList.toggle('sel', i === state.overlaySelection));
}
function moveOverlay(dir){
  const n = state.overlayOptions.length;
  if (n < 2) return;
  state.overlaySelection = (state.overlaySelection + dir + n) % n;
  updateOverlaySelection();
  sfx('move');
}
function confirmOverlay(){
  const msg = state.overlay;
  if (!msg) return;
  if (msg.type === 'info'){
    sfx('ok'); hideOverlay();
    if (msg.onConfirm) msg.onConfirm();
    return;
  }
  if (state.overlaySelection === 0){
    sfx('ok'); hideOverlay();
    if (msg.onConfirm) msg.onConfirm();
    else showToast('実行しました');
  } else {
    sfx('back'); hideOverlay();
    if (msg.onCancel) msg.onCancel();
  }
}
function cancelOverlay(){
  const msg = state.overlay;
  if (!msg) return;
  sfx('back'); hideOverlay();
  if (msg.onCancel) msg.onCancel();
}
function hideOverlay(){
  document.body.classList.remove('overlay-on');
  const was = state.prevMode || 'xmb';
  state.mode = was;
  state.overlay = null;
  if (was === 'xmb'){
    submenuEl.classList.remove('active');
    state.subStack = [];
  } else if (was === 'submenu'){
    requestAnimationFrame(() => positionSubmenu());
  }
  updateHint();
}

/* =========================================================
   決定 / 戻る
   ========================================================= */
function confirm(){
  if (state.mode !== 'xmb') return;
  const cat  = DATA[state.cat];
  const item = cat.items[state.idx[state.cat]];
  if (item.action && item.action.menu){ openSubmenu(item.action.menu); return; }
  if (item.action && item.action.game){ startGame(item.action.game); return; }
  if (item.action && item.action.message){
    sfx('ok'); showOverlay(item.action.message); return;
  }
  sfx('ok');
  showToast(`${cat.name}　›　${item.t}`);
  flashItem();
}
function back(){ sfx('back'); showToast('戻る'); }
function flashItem(){
  const el = itemGroups[state.cat].els[state.idx[state.cat]];
  if (el && el.animate){
    el.animate(
      [ { filter:'brightness(2.6) drop-shadow(0 0 22px rgba(180,230,255,.95))' },
        { filter:'brightness(1)' } ],
      { duration: 420, easing:'ease-out' }
    );
  }
}

/* =========================================================
   ヒント / トースト
   ========================================================= */
function updateHint(){
  if (state.mode === 'overlay'){
    hintEl.textContent = '← → 選択　Enter 決定　Esc 戻る';
  } else if (state.mode === 'submenu'){
    hintEl.textContent = '↑ ↓ 選択　Enter 決定　Esc 戻る';
  } else if (state.mode === 'game'){
    hintEl.textContent = 'ESC で XMB に戻る';
  } else {
    hintEl.textContent = '← → カテゴリ　↑ ↓ 項目　Enter 決定　Esc 戻る';
  }
}
let toastTimer;
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
}

/* ============================================================
   ★ ゲーム機能
   ============================================================ */
function startGame(gameId){
  sfx('ok');
  state.prevMode = state.mode;
  state.mode = 'game';
  gameBodyEl.innerHTML = '';

  if (gameId === 'tictactoe'){
    gameTitleEl.textContent = '○×ゲーム (マルバツ)';
    state.activeGame = createTicTacToe(gameBodyEl);
  } else if (gameId === 'snake'){
    gameTitleEl.textContent = 'スネークゲーム';
    state.activeGame = createSnake(gameBodyEl);
  } else {
    state.activeGame = null;
    state.mode = state.prevMode;
    return;
  }

  document.body.classList.add('game-on');
  updateHint();
}

function exitGame(){
  if (state.activeGame && state.activeGame.destroy){
    try { state.activeGame.destroy(); } catch(e){}
  }
  state.activeGame = null;
  sfx('back');
  document.body.classList.remove('game-on');

  const was = state.prevMode || 'xmb';
  state.mode = was;
  if (was === 'submenu'){
    requestAnimationFrame(() => positionSubmenu());
  } else {
    state.subStack = [];
  }
  updateHint();
}

/* =========================================================
   ○×ゲーム
   ========================================================= */
function createTicTacToe(container){
  const STATUS_IDLE = 'あなた: ○   CPU: ×';
  let board, turn, cursor, done;

  const statusEl = makeStatusEl(container);
  const boardEl  = document.createElement('div');
  boardEl.className = 'ttt-board';
  const cells = [];
  for (let i = 0; i < 9; i++){
    const c = document.createElement('div');
    c.className = 'ttt-cell';
    c.addEventListener('click', () => { cursor = i; updateCursor(); play(i); });
    c.addEventListener('mouseenter', () => { if (!done) { cursor = i; updateCursor(); } });
    boardEl.appendChild(c);
    cells.push(c);
  }
  container.appendChild(boardEl);
  makeHintEl(container, '↑↓←→ で選択 / Enter で配置 / R でリセット');

  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function checkWin(){
    for (const l of LINES){
      const [a,b,c] = l;
      if (board[a] && board[a] === board[b] && board[a] === board[c]){
        return { winner: board[a], line: l };
      }
    }
    if (board.every(v => v)) return { winner: 'draw', line: [] };
    return null;
  }
  function updateCursor(){
    cells.forEach((c, i) => c.classList.toggle('cursor', i === cursor && !done));
  }
  function render(){
    cells.forEach((c, i) => {
      const v = board[i];
      c.textContent = v;
      c.classList.toggle('o', v === 'O');
      c.classList.toggle('x', v === 'X');
      c.classList.toggle('filled', !!v);
    });
    const w = checkWin();
    if (w){
      done = true;
      if (w.winner === 'draw'){
        statusEl.textContent = '引き分け';
      } else {
        statusEl.textContent = `${w.winner === 'O' ? 'あなた (○)' : 'CPU (×)'} の勝ち！`;
        w.line.forEach(i => cells[i].classList.add('win'));
      }
    } else {
      statusEl.textContent = `${STATUS_IDLE}  |  手番: ${turn === 'O' ? '○ (あなた)' : '× (CPU)'}`;
    }
    updateCursor();
  }

  function findBest(sym){
    for (const [a,b,c] of LINES){
      const vals = [board[a], board[b], board[c]];
      if (vals.filter(v => v === sym).length === 2 && vals.filter(v => !v).length === 1){
        return [a,b,c].find(i => !board[i]);
      }
    }
    return null;
  }

  function cpuMove(){
    if (done || turn !== 'X') return;
    let move = findBest('X');
    if (move == null) move = findBest('O');
    if (move == null){
      const order = [4, 0, 2, 6, 8, 1, 3, 5, 7];
      move = order.find(i => !board[i]);
    }
    if (move == null) return;
    board[move] = 'X';
    turn = 'O';
    render();
  }

  function play(i){
    if (done || board[i]) return;
    if (turn !== 'O') return;
    board[i] = 'O';
    turn = 'X';
    render();
    if (!done) setTimeout(cpuMove, 300);
  }

  function reset(){
    board = ['','','','','','','','',''];
    turn = 'O';
    cursor = 4;
    done = false;
    cells.forEach(c => c.classList.remove('win'));
    render();
  }

  function onKey(e){
    if (e.key === 'r' || e.key === 'R'){ reset(); return; }
    if (done) return;
    if (e.key === 'ArrowLeft'){ cursor = (cursor % 3 === 0) ? cursor + 2 : cursor - 1; updateCursor(); }
    else if (e.key === 'ArrowRight'){ cursor = (cursor % 3 === 2) ? cursor - 2 : cursor + 1; updateCursor(); }
    else if (e.key === 'ArrowUp'){ cursor = (cursor < 3) ? cursor + 6 : cursor - 3; updateCursor(); }
    else if (e.key === 'ArrowDown'){ cursor = (cursor >= 6) ? cursor - 6 : cursor + 3; updateCursor(); }
    else if (e.key === 'Enter' || e.key === ' '){ play(cursor); }
  }

  reset();
  return { onKey, destroy(){} };
}

/* =========================================================
   スネークゲーム
   ========================================================= */
function createSnake(container){
  const CELL = 20;
  const COLS = 24;
  const ROWS = 20;

  const statusEl = makeStatusEl(container);
  const canvas = document.createElement('canvas');
  canvas.className = 'snake-canvas';
  canvas.width  = COLS * CELL;
  canvas.height = ROWS * CELL;
  const ctx2d = canvas.getContext('2d');
  container.appendChild(canvas);
  makeHintEl(container, '↑↓←→ で操作 / Space で一時停止 / R でリセット');

  let snake, dir, nextDir, food, score, best = 0, dead, paused, timer;

  function spawnFood(){
    while (true){
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
    }
  }

  function reset(){
    snake   = [ {x:5, y:10}, {x:4, y:10}, {x:3, y:10} ];
    dir     = { x: 1, y: 0 };
    nextDir = dir;
    food    = spawnFood();
    score   = 0;
    dead    = false;
    paused  = false;
    updateStatus();
    draw();
    clearInterval(timer);
    timer = setInterval(tick, 110);
  }

  function tick(){
    if (dead || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)){
      dead = true;
      if (score > best) best = score;
      updateStatus();
      draw();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y){
      score++;
      food = spawnFood();
    } else {
      snake.pop();
    }
    updateStatus();
    draw();
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function draw(){
    ctx2d.fillStyle = 'rgba(8, 20, 40, 0.95)';
    ctx2d.fillRect(0, 0, canvas.width, canvas.height);

    /* grid */
    ctx2d.strokeStyle = 'rgba(80, 140, 200, 0.08)';
    ctx2d.lineWidth = 1;
    for (let x = 0; x <= COLS; x++){
      ctx2d.beginPath();
      ctx2d.moveTo(x * CELL + 0.5, 0);
      ctx2d.lineTo(x * CELL + 0.5, canvas.height);
      ctx2d.stroke();
    }
    for (let y = 0; y <= ROWS; y++){
      ctx2d.beginPath();
      ctx2d.moveTo(0, y * CELL + 0.5);
      ctx2d.lineTo(canvas.width, y * CELL + 0.5);
      ctx2d.stroke();
    }

    /* food */
    if (food){
      ctx2d.fillStyle = '#ff9070';
      ctx2d.shadowColor = '#ff9070';
      ctx2d.shadowBlur = 14;
      ctx2d.beginPath();
      ctx2d.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL * 0.36, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.shadowBlur = 0;
    }

    /* snake */
    snake.forEach((s, i) => {
      const cx = s.x * CELL + CELL/2;
      const cy = s.y * CELL + CELL/2;
      const g = ctx2d.createRadialGradient(cx, cy, 1, cx, cy, CELL * 0.7);
      if (i === 0){
        g.addColorStop(0, '#e8f6ff');
        g.addColorStop(0.55, '#7ec8ff');
        g.addColorStop(1, 'rgba(100, 180, 255, 0.35)');
      } else {
        const t = i / Math.max(1, snake.length - 1);
        g.addColorStop(0, `rgba(160, 220, 255, ${1 - t * 0.55})`);
        g.addColorStop(1, 'rgba(60, 130, 220, 0.25)');
      }
      ctx2d.fillStyle = g;
      ctx2d.shadowColor = 'rgba(120, 200, 255, 0.7)';
      ctx2d.shadowBlur = i === 0 ? 16 : 6;
      const pad = i === 0 ? 1 : 2;
      roundRect(ctx2d, s.x * CELL + pad, s.y * CELL + pad, CELL - pad*2, CELL - pad*2, 4);
      ctx2d.fill();
    });
    ctx2d.shadowBlur = 0;

    /* overlays */
    if (dead){
      ctx2d.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx2d.fillRect(0, 0, canvas.width, canvas.height);
      ctx2d.fillStyle = '#fff';
      ctx2d.textAlign = 'center';
      ctx2d.font = 'bold 34px system-ui, sans-serif';
      ctx2d.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 6);
      ctx2d.font = '15px system-ui, sans-serif';
      ctx2d.fillStyle = 'rgba(200, 220, 240, 0.9)';
      ctx2d.fillText('R でリスタート', canvas.width/2, canvas.height/2 + 32);
    } else if (paused){
      ctx2d.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx2d.fillRect(0, 0, canvas.width, canvas.height);
      ctx2d.fillStyle = '#fff';
      ctx2d.textAlign = 'center';
      ctx2d.font = 'bold 26px system-ui, sans-serif';
      ctx2d.fillText('PAUSED', canvas.width/2, canvas.height/2 + 6);
    }
  }

  function updateStatus(){
    statusEl.textContent =
      `スコア: ${score}   |   ベスト: ${best}` +
      (dead ? '   |   GAME OVER' : paused ? '   |   一時停止中' : '');
  }

  function onKey(e){
    const k = e.key;
    if (k === 'r' || k === 'R'){ reset(); return; }
    if (k === ' ' || k === 'Spacebar'){
      if (!dead){ paused = !paused; updateStatus(); draw(); }
      return;
    }
    if (dead || paused) return;
    if (k === 'ArrowLeft' && dir.x !== 1)       nextDir = { x: -1, y: 0 };
    else if (k === 'ArrowRight' && dir.x !== -1) nextDir = { x: 1,  y: 0 };
    else if (k === 'ArrowUp' && dir.y !== 1)     nextDir = { x: 0,  y: -1 };
    else if (k === 'ArrowDown' && dir.y !== -1)  nextDir = { x: 0,  y: 1  };
  }

  reset();
  return {
    onKey,
    destroy(){ clearInterval(timer); }
  };
}

/* =========================================================
   オーディオ
   ========================================================= */
let actx = null;
let bootAudioEl = null;
let bootSoundConsumed = false;
const sfxPool = {};

function ensureAudio(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      try { actx = new AC(); }
      catch(e){ aerr('AudioContext 作成失敗:', e); actx = null; }
    } else { awarn('このブラウザは Web Audio API に対応していません'); }
  }
  if (actx && actx.state === 'suspended'){
    actx.resume().then(
      () => alog('AudioContext 再開:', actx.state),
      (err) => awarn('AudioContext resume 失敗:', err)
    );
  }
}

function initAudio(){
  alog('=== オーディオ初期化 ===');
  alog('Document URL:', location.href);

  if (BOOT_SOUND_URL){
    const url = resolveUrl(BOOT_SOUND_URL);
    alog('起動音 URL:', url);
    const a = new Audio();
    a.onloadedmetadata = () => alog('起動音 メタデータ完了 / 長さ:', a.duration.toFixed(2), '秒');
    a.oncanplay = () => alog('起動音 再生可能');
    a.onerror = () => {
      const e = a.error;
      aerr('起動音の読み込みに失敗:', url);
      if (e){
        aerr('  code =', e.code, ' / message =', e.message || '(なし)');
        if (e.code === 4) aerr('  → ファイルが存在しない、または形式非対応です');
      }
      bootAudioEl = null;
    };
    a.preload = 'auto'; a.volume = 0.85; a.src = url;
    bootAudioEl = a;
    try { a.load(); } catch(e){ awarn('load() 例外:', e); }
  } else {
    alog('起動音: 未指定（合成音を使用）');
  }

  for (const kind in SFX_URLS){
    const raw = SFX_URLS[kind];
    if (!raw){ alog(`SFX "${kind}": 未指定（合成音）`); continue; }
    const url = resolveUrl(raw);
    alog(`SFX "${kind}" URL:`, url);
    const pool = sfxPool[kind] = [];
    const a = new Audio();
    a.onloadedmetadata = () => alog(`SFX "${kind}" メタデータ完了`);
    a.oncanplay        = () => alog(`SFX "${kind}" 再生可能`);
    a.onerror = () => {
      const e = a.error;
      aerr(`SFX "${kind}" の読み込みに失敗:`, url, e ? `(code=${e.code})` : '');
    };
    a.preload = 'auto'; a.volume = 0.7; a.src = url;
    try { a.load(); } catch(e){ awarn(`SFX "${kind}" load() 例外:`, e); }
    pool.push(a);
  }
  alog('=== オーディオ初期化 完了 ===');
}

function playBootSound(){
  ensureAudio();
  if (bootSoundConsumed){ alog('起動音は既に再生済み'); return; }

  if (bootAudioEl){
    const a = bootAudioEl;
    const doPlay = () => {
      try { a.currentTime = 0; } catch(e){}
      const p = a.play();
      if (p && p.then){
        p.then(() => { bootSoundConsumed = true; alog('★ 起動音ファイル再生'); })
         .catch(err => {
           awarn('起動音 play() 失敗:', err.name, '-', err.message);
           awarn('→ 合成起動音にフォールバック');
           playSynthBootSound();
           bootSoundConsumed = true;
         });
      } else { bootSoundConsumed = true; }
    };
    if (a.readyState >= 2){ doPlay(); return; }

    alog('起動音ロード待機中... readyState =', a.readyState);
    let settled = false;
    const finish = (useSynth) => {
      if (settled) return;
      settled = true;
      a.removeEventListener('canplay', onCanPlay);
      a.removeEventListener('error', onError);
      clearTimeout(timer);
      if (useSynth){
        awarn('→ 合成起動音にフォールバック');
        playSynthBootSound();
        bootSoundConsumed = true;
      } else { doPlay(); }
    };
    const onCanPlay = () => { alog('起動音 canplay 発火'); finish(false); };
    const onError   = () => { aerr('起動音 error 発火'); finish(true); };
    const timer = setTimeout(() => {
      if (a.readyState < 2){ awarn('起動音ロードタイムアウト'); finish(true); }
      else { finish(false); }
    }, 2500);
    a.addEventListener('canplay', onCanPlay);
    a.addEventListener('error', onError);
    return;
  }

  alog('合成起動音を再生');
  playSynthBootSound();
  bootSoundConsumed = true;
}

function sfx(kind){
  const url = SFX_URLS[kind];
  if (url){
    const pool = sfxPool[kind] || [];
    let a = pool.find(x => x.paused || x.ended);
    if (!a && pool.length > 0) a = pool[0];
    if (a && a.readyState >= 2){
      try {
        a.currentTime = 0;
        const p = a.play();
        if (p && p.catch){
          p.catch(err => {
            awarn(`SFX "${kind}" 再生失敗:`, err.message);
            playSynthSfx(kind);
          });
        }
        return;
      } catch(e){ awarn(`SFX "${kind}" 例外:`, e.message); }
    }
    if (a && a.readyState < 2){ playSynthSfx(kind); return; }
  }
  playSynthSfx(kind);
}

function playSynthSfx(kind){
  if (!actx || actx.state !== 'running') return;
  switch(kind){
    case 'move':  tone(1350, 0.055, 'sine', 0.045, 950); tone(2700, 0.03, 'sine', 0.014, 2000); break;
    case 'ok':    tone(880, 0.09, 'sine', 0.06); tone(1320, 0.16, 'sine', 0.05, null, 0.07); break;
    case 'back':  tone(760, 0.10, 'sine', 0.05, 430); break;
    case 'edge':  tone(180, 0.07, 'square', 0.016, 130); break;
  }
}

function tone(freq, dur, type, gain, slideTo, delay){
  if (!actx || actx.state !== 'running') return;
  const t0 = actx.currentTime + (delay || 0);
  const osc = actx.createOscillator();
  const g   = actx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}

function playSynthBootSound(){
  if (!actx || actx.state !== 'running'){
    awarn('AudioContext が running でないため合成起動音を再生できません');
    return;
  }
  alog('合成起動音を生成');
  const t0 = actx.currentTime;

  const bass = actx.createOscillator();
  const bassG = actx.createGain();
  bass.type = 'sine';
  bass.frequency.setValueAtTime(38, t0);
  bass.frequency.exponentialRampToValueAtTime(72, t0 + 2.6);
  bass.frequency.exponentialRampToValueAtTime(52, t0 + 5.2);
  bassG.gain.setValueAtTime(0.0001, t0);
  bassG.gain.linearRampToValueAtTime(0.14, t0 + 0.9);
  bassG.gain.linearRampToValueAtTime(0.09, t0 + 3.2);
  bassG.gain.exponentialRampToValueAtTime(0.0001, t0 + 6.0);
  bass.connect(bassG).connect(actx.destination);
  bass.start(t0); bass.stop(t0 + 6.2);

  const mid = actx.createOscillator();
  const midG = actx.createGain();
  mid.type = 'triangle';
  mid.frequency.setValueAtTime(110, t0);
  mid.frequency.exponentialRampToValueAtTime(168, t0 + 2.6);
  mid.frequency.exponentialRampToValueAtTime(132, t0 + 5.2);
  midG.gain.setValueAtTime(0.0001, t0);
  midG.gain.linearRampToValueAtTime(0.032, t0 + 1.3);
  midG.gain.linearRampToValueAtTime(0.018, t0 + 3.2);
  midG.gain.exponentialRampToValueAtTime(0.0001, t0 + 6.0);
  mid.connect(midG).connect(actx.destination);
  mid.start(t0); mid.stop(t0 + 6.2);

  [880, 1174.66, 1760].forEach((freq, i) => {
    const osc = actx.createOscillator();
    const g   = actx.createGain();
    osc.type = 'sine';
    const st = t0 + 0.45 + i * 0.09;
    osc.frequency.setValueAtTime(freq, st);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(0.055 - i * 0.014, st + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 2.4 + i * 0.25);
    osc.connect(g).connect(actx.destination);
    osc.start(st); osc.stop(st + 3.0);
  });

  const shim = actx.createOscillator();
  const shimG = actx.createGain();
  shim.type = 'sine';
  shim.frequency.setValueAtTime(2000, t0 + 2.3);
  shim.frequency.exponentialRampToValueAtTime(4200, t0 + 3.4);
  shimG.gain.setValueAtTime(0.0001, t0 + 2.3);
  shimG.gain.linearRampToValueAtTime(0.022, t0 + 2.5);
  shimG.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.8);
  shim.connect(shimG).connect(actx.destination);
  shim.start(t0 + 2.3); shim.stop(t0 + 3.9);
}

function unlockAudio(){
  ensureAudio();
  alog('unlockAudio / ctx.state =', actx ? actx.state : '(null)');
}

/* =========================================================
   起動シーケンス
   ========================================================= */
let bootState = 'idle';
function isBooting(){ return bootState === 'running'; }
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function runBootSequence(){
  if (bootState === 'running') return;
  bootState = 'running';
  bootSoundConsumed = false;

  splashEl.style.display = '';
  splashEl.classList.remove('hide', 'logo-in', 'warning-in', 'warning-phase');
  document.body.classList.add('booting');
  void splashEl.offsetWidth;

  await wait(BOOT_TIMING.initialDelay);
  if (bootState !== 'running') return;
  splashEl.classList.add('logo-in');
  playBootSound();

  await wait(BOOT_TIMING.logoHold);
  if (bootState !== 'running') return;
  splashEl.classList.remove('logo-in');
  splashEl.classList.add('warning-phase');

  await wait(BOOT_TIMING.transition);
  if (bootState !== 'running') return;
  splashEl.classList.add('warning-in');

  await wait(BOOT_TIMING.warningHold);
  if (bootState !== 'running') return;
  finishBoot();
}
function finishBoot(){
  if (bootState === 'done') return;
  bootState = 'done';
  splashEl.classList.remove('logo-in', 'warning-in');
  splashEl.classList.add('hide');
  document.body.classList.remove('booting');
  setTimeout(() => {
    if (splashEl) splashEl.style.display = 'none';
  }, BOOT_TIMING.fadeOut + 300);
  updateHint();
}
function skipBoot(){
  if (bootState !== 'running') return;
  bootState = 'skipped';
  finishBoot();
}

/* =========================================================
   電源OFF / ON
   ========================================================= */
let powerOffReady = false;
function enterPowerOff(){
  sfx('back');
  powerOffReady = false;
  document.body.classList.add('booting');
  submenuEl.classList.remove('active');
  state.mode = 'xmb';
  state.subStack = [];
  poweroffEl.classList.add('active');
  poweroffEl.classList.remove('show-hint');
  setTimeout(() => { poweroffEl.classList.add('show-hint'); }, 1200);
  setTimeout(() => { powerOffReady = true; }, 1600);
}
function exitPowerOff(){
  if (!powerOffReady) return;
  powerOffReady = false;
  unlockAudio();
  poweroffEl.classList.remove('active', 'show-hint');
  setTimeout(() => {
    bootState = 'idle';
    runBootSequence();
  }, 500);
}

/* =========================================================
   入力
   ========================================================= */
document.addEventListener('keydown', e => {
  /* ゲームモード */
  if (state.mode === 'game'){
    if (e.key === 'Escape'){
      e.preventDefault();
      exitGame();
      return;
    }
    e.preventDefault();
    if (state.activeGame && state.activeGame.onKey){
      state.activeGame.onKey(e);
    }
    return;
  }

  if (poweroffEl.classList.contains('active')){
    e.preventDefault();
    if (e.repeat) return;
    exitPowerOff();
    return;
  }
  if (isBooting()){ e.preventDefault(); skipBoot(); return; }
  ensureAudio();

  if (state.mode === 'overlay'){
    if (e.key === 'ArrowLeft')       { e.preventDefault(); moveOverlay(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveOverlay(1); }
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); confirmOverlay(); }
    else if (e.key === 'Escape' || e.key === 'Backspace'){
      e.preventDefault();
      if (state.overlayOptions.length > 1) cancelOverlay();
      else { sfx('back'); hideOverlay(); }
    }
    return;
  }
  if (state.mode === 'submenu'){
    if (e.key === 'ArrowUp')    { e.preventDefault(); moveSub(-1); }
    else if (e.key === 'ArrowDown')  { e.preventDefault(); moveSub(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'Escape' || e.key === 'Backspace'){
      e.preventDefault(); closeSubmenu();
    }
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); confirmSub(); }
    return;
  }
  switch(e.key){
    case 'ArrowLeft':  e.preventDefault(); moveCat(-1); break;
    case 'ArrowRight': e.preventDefault(); moveCat(1);  break;
    case 'ArrowUp':    e.preventDefault(); moveItem(-1); break;
    case 'ArrowDown':  e.preventDefault(); moveItem(1);  break;
    case 'Enter':
    case ' ':          e.preventDefault(); confirm(); break;
    case 'Escape':
    case 'Backspace':  e.preventDefault(); back(); break;
  }
});

document.addEventListener('click', e => {
  if (state.mode === 'game') return;   /* ゲーム内のクリックは通す */
  if (poweroffEl.classList.contains('active')){
    e.stopPropagation(); e.preventDefault();
    exitPowerOff(); return;
  }
  if (isBooting()){
    e.stopPropagation(); e.preventDefault();
    skipBoot(); return;
  }
  ensureAudio();
}, true);

let wheelLock = false;
window.addEventListener('wheel', e => {
  if (state.mode === 'game') return;
  if (poweroffEl.classList.contains('active')){ exitPowerOff(); return; }
  if (isBooting()){ skipBoot(); return; }
  ensureAudio();
  if (state.mode === 'overlay') return;
  if (wheelLock) return;
  wheelLock = true;
  setTimeout(() => wheelLock = false, 90);
  if (state.mode === 'submenu'){ moveSub(e.deltaY > 0 ? 1 : -1); return; }
  if (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) moveItem(e.deltaY > 0 ? 1 : -1);
  else                                          moveCat(e.deltaX > 0 ? 1 : -1);
}, { passive: true });

let touchX = 0, touchY = 0;
window.addEventListener('touchstart', e => {
  if (state.mode === 'game') return;
  if (poweroffEl.classList.contains('active') || isBooting()){
    touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; return;
  }
  ensureAudio();
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', e => {
  if (state.mode === 'game') return;
  if (poweroffEl.classList.contains('active')){ exitPowerOff(); return; }
  if (isBooting()){ skipBoot(); return; }
  if (state.mode === 'overlay') return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 42 && Math.abs(dy) < 42) return;
  if (state.mode === 'submenu'){ moveSub(dy < 0 ? 1 : -1); return; }
  if (Math.abs(dx) > Math.abs(dy)) moveCat(dx < 0 ? 1 : -1);
  else                             moveItem(dy < 0 ? 1 : -1);
}, { passive: true });

/* =========================================================
   ナビゲーション
   ========================================================= */
function moveCat(dir){
  if (state.mode !== 'xmb') return;
  const ni = state.cat + dir;
  if (ni < 0 || ni >= DATA.length){ sfx('edge'); bump(dir, 0); return; }
  state.cat = ni; sfx('move'); render();
}
function moveItem(dir){
  if (state.mode !== 'xmb') return;
  const cat = DATA[state.cat];
  const ni  = state.idx[state.cat] + dir;
  if (ni < 0 || ni >= cat.items.length){ sfx('edge'); bump(0, dir); return; }
  state.idx[state.cat] = ni; sfx('move'); render();
}
function bump(dx, dy){
  if (!stage.animate) return;
  stage.animate(
    [ { transform:'translate(0,0)' },
      { transform:`translate(${dx*7}px, ${(dy||0)*5}px)` },
      { transform:'translate(0,0)' } ],
    { duration: 190, easing:'ease-out' }
  );
}

/* =========================================================
   時計
   ========================================================= */
const WEEK = '日月火水木金土';
function tickClock(){
  const d  = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  clockEl.textContent = `${hh}:${mm}`;
  dateEl.textContent  = `${d.getMonth() + 1}月${d.getDate()}日 (${WEEK[d.getDay()]})`;
}
tickClock();
setInterval(tickClock, 10000);

/* =========================================================
   背景波形
   ========================================================= */
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = canvas.width  = Math.max(1, Math.floor(innerWidth  * DPR));
  H = canvas.height = Math.max(1, Math.floor(innerHeight * DPR));
  canvas.style.width  = innerWidth  + 'px';
  canvas.style.height = innerHeight + 'px';
}
window.addEventListener('resize', () => {
  resizeCanvas(); render();
  if (state.mode === 'submenu') positionSubmenu();
});
resizeCanvas();

function drawRibbon(time, idx, hue){
  const N     = 64;
  const amp   = H * (0.085 + idx * 0.016);
  const yBase = H * (0.50 + (idx - 1.5) * 0.075);
  const thick = H * (0.13 + idx * 0.045);
  const speed = 0.42 + idx * 0.16;
  const phase = idx * 2.1;
  const top = [], bot = [];
  for (let i = 0; i <= N; i++){
    const p = i / N;
    const x = -W * 0.12 + p * W * 1.24;
    const y = yBase
            + Math.sin(p * 6.2  + time * speed + phase) * amp
            + Math.sin(p * 13.7 - time * speed * 0.62 + phase * 1.9) * amp * 0.3;
    top.push([x, y]);
    bot.push([x, y + thick * (0.55 + 0.45 * Math.sin(p * Math.PI))]);
  }
  ctx.beginPath();
  ctx.moveTo(top[0][0], top[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(top[i][0], top[i][1]);
  for (let i = N; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
  ctx.closePath();
  const h1 = hue + idx * 34;
  const g  = ctx.createLinearGradient(0, yBase - amp * 1.6, 0, yBase + thick + amp * 1.6);
  g.addColorStop(0.00, `hsla(${h1},        95%, 60%, 0)`);
  g.addColorStop(0.28, `hsla(${h1},        95%, 62%, 0.20)`);
  g.addColorStop(0.52, `hsla(${h1 + 45},   95%, 72%, 0.30)`);
  g.addColorStop(0.78, `hsla(${h1 + 95},   95%, 60%, 0.16)`);
  g.addColorStop(1.00, `hsla(${h1 + 130},  95%, 55%, 0)`);
  ctx.fillStyle = g;
  ctx.fill();
}

const startTime = performance.now();
function drawBG(now){
  const t    = now - startTime;
  const time = t * 0.00016;
  const hue  = (202 + t * 0.0055) % 360;
  ctx.globalCompositeOperation = 'source-over';
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0.0, '#04070e');
  bg.addColorStop(0.5, '#081426');
  bg.addColorStop(1.0, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) drawRibbon(time, i, hue);
  const rg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, H * 0.72);
  rg.addColorStop(0,   `hsla(${hue + 20}, 90%, 60%, 0.10)`);
  rg.addColorStop(0.5, `hsla(${hue + 60}, 90%, 55%, 0.05)`);
  rg.addColorStop(1,   'hsla(220, 90%, 50%, 0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(drawBG);
}

/* =========================================================
   起動
   ========================================================= */
requestAnimationFrame(() => {
  render();
  updateHint();
  requestAnimationFrame(drawBG);
  initAudio();
  setTimeout(() => { poweroffEl.classList.add('show-hint'); }, 300);
  setTimeout(() => { powerOffReady = true; }, 700);
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => {
      if (state.mode === 'submenu') positionSubmenu();
    });
  }
});
</script>
